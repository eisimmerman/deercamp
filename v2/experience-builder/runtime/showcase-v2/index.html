<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover">

  <title data-dxb-document-title>
    DeerCamp Showcase
  </title>

  <link
    rel="stylesheet"
    href="./styles.css">
<style>
/* =========================================================
   DXB-016M.2 — CAMP RINELLA BURNED-IN TABLETOP
   Identity is now part of tabletop.png.
   Runtime navigation and hotspots remain live HTML.
   ========================================================= */

[data-dxb-tabletop-identity],
.dxb-tabletop-neutral-field {
  display: none !important;
}
</style>
</head>

<body>

  <main
    class="experience"
    data-dxb-experience
    aria-live="polite">

    <!-- =====================================================
         WELCOME
         ===================================================== -->

    <section
      class="screen active"
      id="welcomeScreen"
      data-dxb-screen="welcome"
      aria-label="DeerCamp welcome">

      <div class="portrait-stage">

        <img
          class="full-art dxb-welcome-art"
          data-dxb-opening-image
          alt="Private DeerCamp showcase">

        <div
          class="dxb-opening-copy"
          data-dxb-opening-copy>

          <p
            class="dxb-opening-eyebrow"
            data-dxb-opening-eyebrow>
          </p>

          <h1
            class="dxb-opening-title"
            data-dxb-opening-title>
          </h1>

          <p
            class="dxb-opening-body"
            data-dxb-opening-body>
          </p>

          <button
            class="dxb-opening-button glow-target"
            id="enterButton"
            type="button">

            <span data-dxb-opening-cta>
              Enter DeerCamp
            </span>

          </button>

          <button
            class="dxb-about-link"
            id="aboutButton"
            type="button">

            About this showcase

          </button>

        </div>

      </div>

    </section>


    <!-- =====================================================
         ABOUT
         ===================================================== -->

    <section
      class="screen modal-screen"
      id="modalScreen"
      data-dxb-screen="about"
      aria-label="About this DeerCamp showcase">

      <div class="dxb-about-layout">

        <div class="dxb-about-media">

          <img
            class="dxb-about-image"
            data-dxb-about-image
            alt="About this DeerCamp showcase">

        </div>

        <article class="dxb-about-copy">

          <p
            class="dxb-about-eyebrow"
            data-dxb-about-eyebrow>
          </p>

          <h1
            class="dxb-about-title"
            data-dxb-about-title>
          </h1>

          <p
            class="dxb-about-subject"
            data-dxb-about-subject>
          </p>

          <p
            class="dxb-about-body"
            data-dxb-about-body>
          </p>

          <aside
            class="dxb-about-disclaimer"
            data-dxb-about-disclaimer>
          </aside>

          <div class="dxb-about-actions">

            <button
              id="closeButton"
              type="button">

              Back

            </button>

            <button
              id="continueButton"
              type="button">

              <span data-dxb-about-continue>
                Continue
              </span>

            </button>

          </div>

        </article>

      </div>

    </section>


    <!-- =====================================================
         INTRO
         ===================================================== -->

    <section
      class="screen video-screen"
      id="videoScreen"
      data-dxb-screen="intro"
      aria-label="DeerCamp introduction">

      <video
        id="introVideo"
        data-dxb-intro-video
        playsinline
        preload="auto"
        controls>
      </video>

      <div
        class="video-message"
        id="videoMessage"
        hidden>

        The introduction could not load.

      </div>

      <button
        class="skip-button"
        id="skipButton"
        type="button">

        Continue to camp

      </button>

    </section>


    <!-- =====================================================
         TABLETOP
         ===================================================== -->

    <section
      class="screen tabletop-screen"
      id="tabletopScreen"
      data-dxb-screen="tabletop"
      aria-label="Interactive DeerCamp tabletop">

      <div class="landscape-stage">

        <img
          class="full-art tabletop-art"
          data-dxb-tabletop-art
          alt="DeerCamp tabletop">

        <div
          class="dxb-tabletop-neutral-field"
          aria-hidden="true">

          <div class="dxb-neutral-brand">
            DeerCamp
          </div>

        </div>

        <div
          class="dxb-tabletop-identity"
          data-dxb-tabletop-identity>

          <div
            class="dxb-tabletop-camp-name"
            data-dxb-tabletop-camp-name>
          </div>

          <div
            class="dxb-tabletop-subtitle"
            data-dxb-tabletop-subtitle>
          </div>

        </div>

        <nav
          class="dxb-room-launcher"
          data-dxb-room-launcher
          aria-label="DeerCamp Rooms">
        </nav>

        <div
          class="tabletop-status"
          id="tabletopStatus"
          data-dxb-tabletop-guidance>
        </div>

      </div>

    </section>


    <!-- =====================================================
         JOURNEY LAUNCHER
         ===================================================== -->

    <section
      class="screen journey-screen"
      id="journeyScreen"
      data-dxb-screen="journey"
      aria-label="DeerCamp Journeys">

      <div class="dxb-journey-shell">

        <p class="dxb-section-eyebrow">
          CAMP INTELLIGENCE
        </p>

        <h1 data-dxb-journey-title>
          Journeys
        </h1>

        <p data-dxb-journey-intro>
        </p>

        <div data-dxb-journey-list>
        </div>

        <button
          id="journeyBackButton"
          type="button">

          Back to Camp

        </button>

      </div>

    </section>

  </main>


  <!-- =======================================================
       DXB CORE
       ======================================================= -->

  <script src="../../engine/dxb-loader.js?v=20260809-dxb011"></script>

  <script src="../../engine/dxb-validator.js?v=20260809-dxb011"></script>

  <script src="./scripts/dxb-runtime-parameters.js?v=20260809-dxb011"></script>

  <script src="./scripts/dxb-dom-binder-v2.js?v=20260809-dxb011c"></script>

    <script src="./scripts/dxb-progress-engine.js?v=20260809-dxb011d"></script>
  <script src="./scripts/dxb-showcase-runtime-v2.js?v=20260809-dxb011d"></script>

</body>

</html>
