<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover">

  <title>DeerCamp Story</title>

  <link
    rel="stylesheet"
    href="./story-viewer.css">
</head>

<body>

  <main
    class="story-viewer"
    data-dxb-story-viewer>

    <header class="story-viewer-header">

      <button
        class="story-back"
        type="button"
        data-story-back>
        ← Back
      </button>

      <div class="story-room-label">
        <span data-story-room-label>
          DeerCamp
        </span>
      </div>

      <div
        class="story-camp-name"
        data-story-camp-name>
      </div>

    </header>


    <article class="story-shell">

      <section class="story-hero">

        <img
          class="story-hero-image"
          data-story-image
          alt="Featured DeerCamp story">

        <div
          class="story-hero-shade"
          aria-hidden="true">
        </div>

        <div class="story-hero-copy">

          <p
            class="story-kicker"
            data-story-kicker>
          </p>

          <h1 data-story-title>
            DeerCamp Story
          </h1>

          <p
            class="story-subtitle"
            data-story-subtitle>
          </p>

        </div>

      </section>


      <section
        class="story-content"
        data-story-content>

        <div class="story-main">

          <section
            class="story-section"
            data-story-overview-section>

            <p class="story-section-eyebrow">
              OVERVIEW
            </p>

            <div
              class="story-overview"
              data-story-overview>
            </div>

          </section>


          <blockquote
            class="story-quote"
            data-story-quote>
          </blockquote>


          <section
            class="story-section"
            data-story-why-section>

            <p class="story-section-eyebrow">
              WHY IT MATTERS
            </p>

            <div
              class="story-why"
              data-story-why>
            </div>

          </section>

        </div>


        <aside class="story-side">

          <section class="story-meta-panel">

            <p class="story-section-eyebrow">
              STORY DETAILS
            </p>

            <dl class="story-meta">

              <div>
                <dt>Type</dt>
                <dd data-story-type></dd>
              </div>

              <div>
                <dt>Theme</dt>
                <dd data-story-theme></dd>
              </div>

              <div>
                <dt>Source</dt>
                <dd data-story-source></dd>
              </div>

            </dl>

          </section>


          <section class="story-related-panel">

            <p class="story-section-eyebrow">
              RELATED TOPICS
            </p>

            <div
              class="story-related"
              data-story-related>
            </div>

          </section>


          <section class="story-action-panel">

            <p class="story-section-eyebrow">
              CREATE &amp; SHARE
            </p>

            <h2 data-story-action-title>
              Add Your Story
            </h2>

            <p data-story-action-copy>
              What would your camp add to this conversation?
            </p>

            <button
              type="button"
              class="story-action-button"
              data-story-action>
              Add Your Story
            </button>

          </section>

        </aside>

      </section>


      <aside
        class="story-disclaimer"
        data-story-disclaimer>
      </aside>


      <footer class="story-footer">

        <button
          class="story-back story-back-bottom"
          type="button"
          data-story-back>
          ← Back to Room
        </button>

      </footer>

    </article>

  </main>

  <script
    src="./story-viewer.js?v=20260810-dxb013a">
  </script>

</body>
</html>
