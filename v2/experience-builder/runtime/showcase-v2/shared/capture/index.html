<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover">

  <title>DeerCamp Create & Share</title>

  <link
    rel="stylesheet"
    href="./capture.css">
</head>

<body>

  <main class="capture-shell">

    <header class="capture-header">

      <button
        type="button"
        class="capture-back"
        data-capture-back>
        ← Back
      </button>

      <div>

        <p class="capture-eyebrow">
          CREATE &amp; SHARE
        </p>

        <h1 data-capture-title>
          Create & Share
        </h1>

        <p data-capture-intro></p>

      </div>

      <div
        class="capture-camp-name"
        data-capture-camp-name>
      </div>

    </header>


    <section
      class="guided-stage"
      data-guided-stage>


      <section
        class="guided-step"
        data-step="scenario">

        <p class="capture-step-label">
          STEP 1 OF 4
        </p>

        <h2>
          What would you like to add?
        </h2>

        <div
          class="scenario-grid"
          data-scenario-grid>
        </div>

      </section>


      <section
        class="guided-step"
        data-step="choice"
        hidden>

        <button
          type="button"
          class="step-back"
          data-step-back="scenario">
          ← Change choice
        </button>

        <p class="capture-step-label">
          STEP 2 OF 4
        </p>

        <h2 data-choice-title>
          Choose one
        </h2>

        <div
          class="choice-grid"
          data-choice-grid>
        </div>

      </section>


      <section
        class="guided-step"
        data-step="response"
        hidden>

        <button
          type="button"
          class="step-back"
          data-step-back="choice">
          ← Back
        </button>

        <p class="capture-step-label">
          STEP 3 OF 4
        </p>

        <div
          class="selected-summary"
          data-selected-summary>
        </div>

        <div
          class="guided-field">

          <label
            for="guidedTitle">
            Choose a title
          </label>

          <div
            class="title-choice-grid"
            data-title-choice-grid>
          </div>

          <input
            id="guidedTitle"
            data-guided-title
            type="text"
            placeholder="Or write your own title">

        </div>


        <div class="guided-field">

          <label
            for="guidedResponse"
            data-response-label>
            Add your thought
          </label>

          <textarea
            id="guidedResponse"
            data-guided-response
            placeholder="A sentence or two is enough.">
          </textarea>

        </div>


        <div
          class="guided-media"
          data-guided-media>

          <button
            type="button"
            data-guided-voice>
            Tell It Instead
          </button>

          <div
            class="guided-voice-state"
            data-guided-voice-state>
          </div>

        </div>


        <button
          type="button"
          class="primary-action"
          data-review-button>
          Preview My Post →
        </button>

      </section>


      <section
        class="guided-step"
        data-step="preview"
        hidden>

        <button
          type="button"
          class="step-back"
          data-step-back="response">
          ← Edit
        </button>

        <p class="capture-step-label">
          STEP 4 OF 4
        </p>

        <h2>
          Here's what you're adding
        </h2>

        <article
          class="created-card preview-card"
          data-preview-card>
        </article>

        <button
          type="button"
          class="primary-action"
          data-save-button>
          Save &amp; Share
        </button>

      </section>


      <section
        class="guided-step"
        data-step="success"
        hidden>

        <p class="capture-step-label">
          ADDED TO CAMP RINELLA
        </p>

        <h2 data-success-title>
          Your post is now part of Camp Rinella.
        </h2>

        <article
          class="created-card"
          data-created-card>
        </article>

        <div class="success-actions">

          <button
            type="button"
            class="primary-action"
            data-view-feed>
            View in CampFeed
          </button>

          <button
            type="button"
            class="secondary-action"
            data-return-room>
            Return to CampFire
          </button>

        </div>

      </section>


    </section>

  </main>

  <script
    src="./capture.js?v=20260810-dxb014g">
  </script>

</body>
</html>
