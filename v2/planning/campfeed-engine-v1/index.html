<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <title>CampFeed Room | DeerCamp V2</title>

  <script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore-compat.js"></script>
  <script src="../../../firebase-web.js"></script>

  <link rel="stylesheet" href="../engine/room-engine.css" />
</head>

<body>
  <main class="room-engine-shell">
    <header class="room-engine-header">
      <p id="roomBrandEyebrow" class="room-engine-eyebrow">
        DEERCAMP
      </p>

      <h1 id="roomTitle">
        CampFeed Room
      </h1>

      <p id="roomTagline" class="room-engine-tagline">
        Camp-wide activity from every room.
      </p>

      <div class="room-engine-camp-identity">
        <strong id="roomCampName">Loading camp...</strong>
        <span id="roomCampLocation"></span>
      </div>
    </header>

    <section class="room-engine-layout">
      <aside class="room-engine-panel room-engine-panel-view">
        <h2 class="room-engine-panel-title">
          View &amp; Discover
        </h2>

        <div
          id="roomViewActions"
          class="room-engine-action-list"
        ></div>
      </aside>

      <section class="room-engine-center">
        <header class="room-engine-center-header">
          <h2 class="room-engine-feed-title">
            CampFeed
          </h2>
        </header>

        <div
          id="roomFeed"
          class="room-engine-feed"
        ></div>
      </section>

      <aside class="room-engine-panel room-engine-panel-create">
        <h2 class="room-engine-panel-title">
          Create &amp; Share
        </h2>

        <div
          id="roomCreateActions"
          class="room-engine-action-list"
        ></div>
      </aside>
    </section>

    <section class="room-engine-status">
      <div>
        <span>Camp ID</span>
        <strong id="roomCampId">Resolving...</strong>
      </div>

      <div>
        <span>Steward</span>
        <strong id="roomSteward">Loading...</strong>
      </div>

      <div>
        <span>Data Source</span>
        <strong id="roomDataSource">Connecting...</strong>
      </div>

      <div>
        <span>Firebase Project</span>
        <strong id="roomFirebaseProject">Resolving...</strong>
      </div>
    </section>

    <p id="roomStatusMessage" class="room-engine-message">
      Preparing CampFeed...
    </p>

    <nav
      id="roomNavigation"
      class="room-engine-navigation"
      aria-label="DeerCamp rooms"
    ></nav>
  </main>

  <script src="../engine/room-registry.js"></script>
  <script src="../engine/room-engine.js"></script>
  <script src="./campfeed.js"></script>
</body>
</html>
