<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <title>DeerCamp V2 Main Camp</title>

  <script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore-compat.js"></script>
  <script src="../../firebase-web.js"></script>

  <link rel="stylesheet" href="../shared/main-camp.css" />
</head>

<body>
  <main class="main-camp-shell">
    <header class="camp-header">
      <div>
        <p class="camp-eyebrow">DEERCAMP V2</p>
        <h1 id="campName">Loading DeerCamp...</h1>
        <p id="campLocation" class="camp-location"></p>
      </div>

      <a id="backLink" class="header-link" href="../index.html">
        Back to Camp Entry
      </a>
    </header>

    <section class="camp-stage" aria-labelledby="roomHeading">
      <div class="camp-stage-copy">
        <p class="stage-label">Your Camp Rooms</p>

        <h2 id="roomHeading">
          Step inside your DeerCamp
        </h2>

        <p id="stageMessage">
          Preparing the room-based experience...
        </p>
      </div>

      <div class="room-grid">
        <button class="room-card is-current" data-room="archives" type="button">
          <span class="room-symbol">□</span>
          <span class="room-name">Archives</span>
          <span class="room-description">
            View and preserve camp history, memories, records, and stories.
          </span>
          <span class="room-state">First room build</span>
        </button>

        <button class="room-card" data-room="maps" type="button">
          <span class="room-symbol">△</span>
          <span class="room-name">Maps</span>
          <span class="room-description">
            Explore stands, drives, property maps, and hunting locations.
          </span>
          <span class="room-state">Planned</span>
        </button>

        <button class="room-card" data-room="campfeed" type="button">
          <span class="room-symbol">○</span>
          <span class="room-name">CampFeed</span>
          <span class="room-description">
            See the latest pictures, voices, updates, and camp activity.
          </span>
          <span class="room-state">Planned</span>
        </button>

        <button class="room-card" data-room="memory-voice" type="button">
          <span class="room-symbol">□</span>
          <span class="room-name">Memory &amp; Voice</span>
          <span class="room-description">
            Capture a picture, record a voice, and preserve the story.
          </span>
          <span class="room-state">Planned</span>
        </button>
      </div>
    </section>

    <section class="camp-status">
      <div>
        <span>Camp ID</span>
        <strong id="campIdValue">Resolving...</strong>
      </div>

      <div>
        <span>Steward</span>
        <strong id="stewardValue">Loading...</strong>
      </div>

      <div>
        <span>Data Source</span>
        <strong id="dataSourceValue">Connecting...</strong>
      </div>

      <div>
        <span>Firebase Project</span>
        <strong id="firebaseProjectValue">Resolving...</strong>
      </div>
    </section>

    <footer class="camp-footer">
      <a id="currentCampLink" href="../../camp.html">
        View Current Camp
      </a>

      <a id="dashboardLink" href="../../steward-dashboard.html">
        Steward Dashboard
      </a>
    </footer>
  </main>

  <script src="../shared/main-camp.js"></script>
</body>
</html>
