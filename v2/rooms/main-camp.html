<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <title>DeerCamp Main Camp</title>

  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
  <script src="../../firebase-web.js"></script>

  <link rel="stylesheet" href="../shared/main-camp.css" />
</head>

<body>
  <main class="main-camp-shell">
    <header class="camp-header">
      <div>
        <h1 id="campName">Loading DeerCamp...</h1>
        <p id="campLocation" class="camp-location"></p>
      </div>

      <a id="backLink" class="header-link" href="../index.html">
        Back to Camp Entry
      </a>
    </header>

    <section class="camp-stage tabletop-stage" aria-label="Interactive DeerCamp tabletop">
      <div class="tabletop-frame">
        <img
          class="tabletop-art"
          src="../experience-builder/runtime/showcase-v2/assets/main-cabin-tabletop-v2.png"
          alt=""
          aria-hidden="true"
        />

        <div class="tabletop-camp-identity" aria-label="Camp identity">
          <strong id="tabletopCampName">Your DeerCamp</strong>
          <span id="tabletopCampEstablished"></span>
        </div>

        <nav class="tabletop-navigation" aria-label="DeerCamp rooms">
          <a class="tabletop-hotspot tabletop-archives" data-room="archives" href="./archives/index.html" data-tooltip="Archives" aria-label="Enter Archives"></a>
          <a class="tabletop-hotspot tabletop-maps" data-room="maps" href="./maps/index.html" data-tooltip="Maps" aria-label="Enter Maps"></a>
          <a class="tabletop-hotspot tabletop-memories" data-room="memory" href="./memory/index.html" data-tooltip="Memories" aria-label="Enter Memories"></a>
          <a class="tabletop-hotspot tabletop-campfire" data-room="campfire" href="./campfire/index.html" data-tooltip="CampFire" aria-label="Enter CampFire"></a>
          <a class="tabletop-hotspot tabletop-campfeed" data-room="campfeed" href="./campfeed/index.html" data-tooltip="CampFeed" aria-label="Enter CampFeed"></a>
        </nav>
      </div>

      <p id="stageMessage" class="tabletop-guidance">
        Select an object to enter a room.
      </p>
    </section>
  </main>

  <script src="../shared/main-camp.js"></script>
</body>
</html>
