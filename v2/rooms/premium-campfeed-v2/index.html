<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <title>CampFeed Room | DeerCamp V2</title>

  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-storage-compat.js"></script>
  <script src="../../../firebase-web.js"></script>

  <link
    rel="stylesheet"
    href="../premium-engine-v2/premium-engine.css?v=20260805-2008"
  />
  <link
    rel="stylesheet"
    href="../premium-engine-v2/universal-viewer.css?v=20260807-sprint4-phase1"
  />
</head>

<body>
  <main class="premium-v2-shell">
    <section
      class="premium-v2-stage"
      aria-label="DeerCamp CampFeed Room"
    >
      <img
        id="premiumRoomArtwork"
        class="premium-v2-artwork"
        src="./assets/campfeed-room.png"
        alt="DeerCamp CampFeed Room with camp-wide activity, View and Discover actions, Create and Share actions, and room navigation."
      />

      <div class="premium-v2-identity">
        <strong id="premiumCampName">
          Loading camp...
        </strong>

        <span id="premiumCampLocation"></span>
      </div>

      <div
        id="premiumHotspotLayer"
        class="premium-v2-hotspot-layer"
        aria-label="CampFeed room actions"
      ></div>
    </section>



    <p
      id="premiumError"
      class="premium-v2-error"
      hidden
    ></p>
  </main>
  <dialog id="universalViewer" class="universal-viewer" aria-label="DeerCamp Memory Viewer">
    <div class="memory-viewer-shell">
      <header class="memory-viewer-header">
        <div>
          <p id="memoryViewerKicker" class="memory-viewer-kicker">MEMORY VIEWER</p>
          <h2 id="memoryViewerCollectionTitle" class="memory-viewer-collection-title">DeerCamp Memories</h2>
        </div>
        <button id="universalViewerClose" class="universal-viewer-close" type="button">Close</button>
      </header>

      <div id="memoryViewerBody" class="memory-viewer-body">
        <div id="memoryViewerEmpty" class="memory-viewer-empty" hidden></div>
        <div id="memoryViewerContent" class="memory-viewer-content">
          <section class="memory-viewer-hero-column">
            <div id="memoryViewerHeroFrame" class="memory-viewer-hero-frame">
              <img id="memoryViewerHero" class="memory-viewer-hero" alt="" hidden />
              <div id="memoryViewerHeroPlaceholder" class="memory-viewer-hero-placeholder">DeerCamp memory</div>
            </div>
          </section>

          <section class="memory-viewer-detail-column">
            <h2 id="memoryViewerItemTitle" class="memory-viewer-item-title">Memory title</h2>
            <p id="memoryViewerSubtitle" class="memory-viewer-subtitle"></p>
            <div class="memory-viewer-byline">
              <span id="memoryViewerAuthor"></span>
              <span id="memoryViewerRoom"></span>
              <span id="memoryViewerTimestamp"></span>
            </div>

            <section
              id="memoryViewerStewardActions"
              class="memory-viewer-section"
              hidden
            >
              <button
                id="memoryViewerRemovePost"
                class="memory-viewer-nav-button"
                type="button"
              >
                Remove Post
              </button>
              <p
                id="memoryViewerRemoveFeedback"
                class="memory-viewer-comment-feedback"
                aria-live="polite"
              ></p>
            </section>

            <section id="memoryViewerAudioSection" class="memory-viewer-section" hidden>
              <h3>Listen</h3>
              <audio id="memoryViewerAudio" class="memory-viewer-audio" controls preload="metadata"></audio>
            </section>

            <section id="memoryViewerTranscriptSection" class="memory-viewer-section">
              <h3>Story</h3>
              <p id="memoryViewerTranscript" class="memory-viewer-transcript"></p>
            </section>

            <section id="memoryViewerCommentsSection" class="memory-viewer-section">
              <h3>Camp Comments</h3>
              <div id="memoryViewerComments" class="memory-viewer-comments"></div>

              <div class="memory-viewer-comment-form">
                <label for="memoryViewerCommentText">Add a comment</label>
                <textarea
                  id="memoryViewerCommentText"
                  rows="3"
                  maxlength="1000"
                  placeholder="Add a comment about this CampFeed post."
                ></textarea>
                <button
                  id="memoryViewerCommentSubmit"
                  class="memory-viewer-nav-button"
                  type="button"
                >
                  Add Comment
                </button>
                <p
                  id="memoryViewerCommentFeedback"
                  class="memory-viewer-comment-feedback"
                  aria-live="polite"
                ></p>
              </div>
            </section>

            <section id="memoryViewerTagsSection" class="memory-viewer-section" hidden>
              <h3>Tags</h3>
              <div id="memoryViewerTags" class="memory-viewer-tags"></div>
            </section>

            <section id="memoryViewerMetadataSection" class="memory-viewer-section" hidden>
              <h3>Memory Details</h3>
              <div id="memoryViewerMetadata" class="memory-viewer-metadata"></div>
            </section>
          </section>
        </div>
      </div>

      <footer class="memory-viewer-footer">
        <button id="memoryViewerPrevious" class="memory-viewer-nav-button" type="button">â† Previous</button>
        <span id="memoryViewerPosition" class="memory-viewer-position">1 of 1</span>
        <button id="memoryViewerNext" class="memory-viewer-nav-button" type="button">Next â†’</button>
      </footer>
    </div>
  </dialog>


  <dialog
    id="premiumActionDialog"
    class="premium-v2-dialog"
  >
    <div class="premium-v2-dialog-card">
      <button
        id="premiumDialogClose"
        class="premium-v2-dialog-close"
        type="button"
      >
        Close
      </button>

      <h2 id="premiumDialogTitle">
        CampFeed Action
      </h2>

      <p id="premiumDialogMessage">
        This interaction is ready for its production workflow.
      </p>
      <div id="premiumAuthForm" hidden>
        <label for="premiumAuthEmail">Email</label>
        <input
          id="premiumAuthEmail"
          type="email"
          autocomplete="email"
          placeholder="you@example.com"
        />

        <button
          id="premiumAuthSendLink"
          class="memory-viewer-nav-button"
          type="button"
        >
          Send Sign-In Link
        </button>

        <p
          id="premiumAuthFeedback"
          class="memory-viewer-comment-feedback"
          aria-live="polite"
        ></p>
      </div>
      <div id="premiumPhotoShareForm" hidden>
        <label for="premiumPhotoFile">Photo</label>
        <input
          id="premiumPhotoFile"
          type="file"
          accept="image/*"
        />

        <label for="premiumPhotoCaption">Caption</label>
        <textarea
          id="premiumPhotoCaption"
          rows="4"
          maxlength="1000"
          placeholder="What happened?"
        ></textarea>

        <button
          id="premiumPhotoPublish"
          class="memory-viewer-nav-button"
          type="button"
        >
          Share Photo
        </button>

        <p
          id="premiumPhotoFeedback"
          class="memory-viewer-comment-feedback"
          aria-live="polite"
        ></p>
      </div>
    </div>
  </dialog>

  <script src="./room-config.js?v=20260806-sprint2"></script>
  <script src="../premium-engine-v2/premium-engine.js?v=20260806-sprint2"></script>
  <script src="../premium-engine-v2/universal-viewer.js?v=20260807-sprint4-phase1"></script>
  <script src="../premium-engine-v2/firestore-adapter.js?v=20260806-1725"></script>
  <script src="../premium-engine-v2/viewer-state.js?v=20260806-1530"></script>
  <script src="../premium-engine-v2/memory-provider.js?v=20260806-1555"></script>

  <script>
    (function () {
      "use strict";

      const dialog =
        document.getElementById("premiumActionDialog");

      const dialogTitle =
        document.getElementById("premiumDialogTitle");

      const dialogMessage =
        document.getElementById("premiumDialogMessage");

      const closeButton =
        document.getElementById("premiumDialogClose");

      const errorMessage =
        document.getElementById("premiumError");
      document.addEventListener(
        "deercamp:premium-action",
        async function (event) {
          const detail = event.detail || {};
          const config = window.DEERCAMP_PREMIUM_ROOM || {};

          if (detail.type === "view") {
            const viewer =
              config.viewers &&
              config.viewers[detail.action];

            if (!viewer) {
              window.DeerCampUniversalViewer.showError(
                `No viewer is configured for ${detail.label || detail.action}.`
              );

              return;
            }

            const campId =
              window.DeerCampPremiumEngine &&
              typeof window.DeerCampPremiumEngine.getCampId === "function"
                ? window.DeerCampPremiumEngine.getCampId()
                : "";

            try {
              const result =
                await window.DeerCampMemoryProvider.load({
                  campId,
                  mode: viewer.mode,
                  limit: 50
                });

              window.DeerCampUniversalViewer.show({
                kicker: viewer.kicker,
                title: viewer.title,
                items: result.items,
                selectedIndex: 0,
                context: {
                  campId,
                  source: result.source,
                  collection: result.collection,
                  mode: viewer.mode
                }
              });
            } catch (error) {
              console.error(
                "Live DeerCamp memories could not be loaded.",
                error
              );

              const currentUser =
                window.DeerCampAuth &&
                typeof window.DeerCampAuth.getCurrentUser === "function"
                  ? window.DeerCampAuth.getCurrentUser()
                  : null;

              const permissionDenied =
                error &&
                (
                  error.code === "permission-denied" ||
                  String(error.message || "")
                    .toLowerCase()
                    .includes("insufficient permissions")
                );

              if (!currentUser && permissionDenied) {
                showAuthDialog(
                  "Sign in to view this private CampFeed."
                );
              } else {
                window.DeerCampUniversalViewer.showError(
                  error.message ||
                  "Live DeerCamp memories could not be loaded."
                );
              }
            }

            return;
          }

          dialogTitle.textContent =
             detail.label || "CampFeed Action";

           const photoForm =
             document.getElementById("premiumPhotoShareForm");

           if (
             detail.type === "create" &&
             detail.action === "photo-caption"
           ) {
             dialogMessage.textContent =
               "Choose a photo, add an optional caption, and share it with your camp.";

             if (photoForm) {
               photoForm.hidden = false;
             }
           } else {
             dialogMessage.textContent =
               `The ${detail.action || "selected"} workflow will be connected next.`;

             if (photoForm) {
               photoForm.hidden = true;
             }
           }

          if (
            dialog &&
            typeof dialog.showModal === "function"
          ) {
            dialog.showModal();
          }
        }
      );
      closeButton.addEventListener(
        "click",
        function () {
          dialog.close();
        }
      );

      const photoFile =
        document.getElementById("premiumPhotoFile");

      const photoCaption =
        document.getElementById("premiumPhotoCaption");

      const photoPublish =
        document.getElementById("premiumPhotoPublish");

      const photoFeedback =
        document.getElementById("premiumPhotoFeedback");

      const authForm =
        document.getElementById("premiumAuthForm");

      const authEmail =
        document.getElementById("premiumAuthEmail");

      const authSendLink =
        document.getElementById("premiumAuthSendLink");

      const authFeedback =
        document.getElementById("premiumAuthFeedback");

      function showAuthDialog(message) {
        if (dialogTitle) {
          dialogTitle.textContent =
            "Sign in to DeerCamp";
        }

        if (dialogMessage) {
          dialogMessage.textContent =
            message ||
            "Sign in to view this private CampFeed.";
        }

        if (authForm) {
          authForm.hidden = false;
        }

        const photoForm =
          document.getElementById("premiumPhotoShareForm");

        if (photoForm) {
          photoForm.hidden = true;
        }

        if (
          dialog &&
          typeof dialog.showModal === "function" &&
          !dialog.open
        ) {
          dialog.showModal();
        }
      }

      if (authSendLink) {
        authSendLink.addEventListener(
          "click",
          async function () {
            const email =
              String(
                authEmail
                  ? authEmail.value
                  : ""
              )
                .trim()
                .toLowerCase();

            if (!email) {
              if (authFeedback) {
                authFeedback.textContent =
                  "Enter your DeerCamp email.";
              }

              if (authEmail) {
                authEmail.focus();
              }

              return;
            }

            authSendLink.disabled = true;

            if (authFeedback) {
              authFeedback.textContent =
                "Sending sign-in link...";
            }

            try {
              if (
                !window.DeerCampAuth ||
                typeof window.DeerCampAuth.sendEmailSignInLink !== "function"
              ) {
                throw new Error(
                  "DeerCamp sign-in is unavailable."
                );
              }

              await window.DeerCampAuth.sendEmailSignInLink(
                email,
                {
                  returnUrl: window.location.href
                }
              );

              if (authFeedback) {
                authFeedback.textContent =
                  "Sign-in link sent. Open the email link on this device.";
              }
            } catch (error) {
              console.error(
                "DeerCamp sign-in link could not be sent.",
                error
              );

              if (authFeedback) {
                authFeedback.textContent =
                  error.message ||
                  "Sign-in link could not be sent.";
              }
            } finally {
              authSendLink.disabled = false;
            }
          }
        );
      }

      async function completePendingEmailSignIn() {
        if (
          !window.DeerCampAuth ||
          typeof window.DeerCampAuth.isEmailSignInLink !== "function" ||
          !window.DeerCampAuth.isEmailSignInLink(window.location.href)
        ) {
          return null;
        }

        try {
          const user =
            await window.DeerCampAuth.completeEmailSignIn({
              url: window.location.href
            });

          if (user) {
            const cleanUrl =
              new URL(window.location.href);

            [
              "apiKey",
              "oobCode",
              "mode",
              "lang"
            ].forEach(function (key) {
              cleanUrl.searchParams.delete(key);
            });

            window.history.replaceState(
              {},
              document.title,
              cleanUrl.pathname +
                cleanUrl.search +
                cleanUrl.hash
            );
          }

          return user || null;
        } catch (error) {
          console.error(
            "DeerCamp email sign-in could not be completed.",
            error
          );

          showAuthDialog(
            error.message ||
            "The DeerCamp sign-in link could not be completed."
          );

          return null;
        }
      }
      async function getSignedInUser() {
        if (
          !window.firebase ||
          typeof firebase.auth !== "function"
        ) {
          throw new Error(
            "Firebase Authentication is unavailable."
          );
        }

        const auth =
          firebase.auth();

        let user =
          auth.currentUser;

        if (!user) {
          user = await new Promise((resolve) => {
            let settled = false;

            const unsubscribe =
              auth.onAuthStateChanged((nextUser) => {
                if (settled || !nextUser) {
                  return;
                }

                settled = true;

                try {
                  unsubscribe();
                } catch (error) {}

                resolve(nextUser);
              });

            setTimeout(() => {
              if (settled) {
                return;
              }

              settled = true;

              try {
                unsubscribe();
              } catch (error) {}

              resolve(auth.currentUser || null);
            }, 3000);
          });
        }

        if (!user || user.isAnonymous) {
          throw new Error(
            "Sign in before sharing to CampFeed."
          );
        }

        return user;
      }

      function getPhotoAuthorName(user) {
        const displayName =
          String(user.displayName || "").trim();

        if (displayName) {
          return displayName;
        }

        const email =
          String(user.email || "").trim();

        if (email) {
          return email
            .split("@")[0]
            .replace(/[._-]+/g, " ")
            .replace(/\s+/g, " ")
            .trim()
            .replace(/\b\w/g, function (character) {
              return character.toUpperCase();
            });
        }

        return "DeerCamp Member";
      }

      if (photoPublish) {
        photoPublish.addEventListener(
          "click",
          async function () {
            const file =
              photoFile &&
              photoFile.files &&
              photoFile.files[0];

            const caption =
              String(
                photoCaption
                  ? photoCaption.value
                  : ""
              ).trim();

            if (!file) {
              if (photoFeedback) {
                photoFeedback.textContent =
                  "Choose a photo before sharing.";
              }

              return;
            }

            if (
              file.type &&
              !String(file.type).startsWith("image/")
            ) {
              if (photoFeedback) {
                photoFeedback.textContent =
                  "Choose an image file.";
              }

              return;
            }

            photoPublish.disabled = true;

            if (photoFeedback) {
              photoFeedback.textContent =
                "Uploading photo...";
            }

            try {
              const user =
                await getSignedInUser();

              const campId =
                window.DeerCampPremiumEngine &&
                typeof window.DeerCampPremiumEngine.getCampId === "function"
                  ? window.DeerCampPremiumEngine.getCampId()
                  : "";

              if (!campId) {
                throw new Error(
                  "No active DeerCamp camp was found."
                );
              }

              if (
                !window.DeerCampStorage ||
                typeof window.DeerCampStorage.uploadCampImageFilePair !== "function"
              ) {
                throw new Error(
                  "DeerCamp photo upload is unavailable."
                );
              }

              const entityId =
                `web-${Date.now()}-${user.uid.slice(0, 8)}`;

              const uploaded =
                await window.DeerCampStorage.uploadCampImageFilePair({
                  campId,
                  folder: "campfeed",
                  entityId,
                  file
                });

              const imageUrl =
                String(
                  uploaded.displayUrl ||
                  uploaded.thumbUrl ||
                  ""
                ).trim();

              if (!imageUrl) {
                throw new Error(
                  "Photo upload did not return a Firebase Storage URL."
                );
              }

              if (
                !window.firebase ||
                typeof firebase.firestore !== "function"
              ) {
                throw new Error(
                  "Cloud Firestore is unavailable."
                );
              }

              const authorName =
                getPhotoAuthorName(user);

              const createdAtMs =
                Date.now();

              const cleanCaption =
                caption ||
                "Photo shared from DeerCamp.";

              const feedDoc = {
                campId,
                authorId: user.uid,
                authorName,
                author: authorName,
                title: "Field Photo",
                caption: cleanCaption,
                body: cleanCaption,
                titleSource: "fallback",
                captionSource:
                  caption ? "manual" : "fallback",
                transcript: "",
                transcriptPreview: "",
                transcriptionStatus:
                  "not_applicable",
                transcriptionError: "",
                generatedTitle: "",
                generatedCaption: "",
                imageUrl,
                displayUrl:
                  uploaded.displayUrl ||
                  imageUrl,
                thumbUrl:
                  uploaded.thumbUrl ||
                  imageUrl,
                thumbnailUrl:
                  uploaded.thumbUrl ||
                  imageUrl,
                mediaType: "photo",
                type: "photo",
                category: "field-note",
                tags: [
                  "Picture",
                  "Field Memory",
                  "Web"
                ],
                published: true,
                source: "app",
                localMemoryId: entityId,
                createdAt:
                  firebase.firestore.FieldValue.serverTimestamp(),
                createdAtMs,
                clientCreatedAt:
                  createdAtMs,
                imagePath:
                  uploaded.displayPath ||
                  uploaded.thumbPath ||
                  ""
              };

              const docRef =
                await firebase
                  .firestore()
                  .collection("feedItems")
                  .add(feedDoc);

              if (!docRef || !docRef.id) {
                throw new Error(
                  "CampFeed publish was not confirmed."
                );
              }

              if (photoFeedback) {
                photoFeedback.textContent =
                  "Photo shared to CampFeed.";
              }

              if (photoFile) {
                photoFile.value = "";
              }

              if (photoCaption) {
                photoCaption.value = "";
              }
            } catch (error) {
              console.error(
                "CampFeed photo could not be shared.",
                error
              );

              const needsSignIn =
                error &&
                String(error.message || "")
                  .toLowerCase()
                  .includes("sign in before sharing");

              if (needsSignIn) {
                showAuthDialog(
                  "Sign in before sharing to CampFeed."
                );
              } else if (photoFeedback) {
                photoFeedback.textContent =
                  error.message ||
                  "Photo could not be shared. Please try again.";
              }
            } finally {
              photoPublish.disabled = false;
            }
          }
        );
      }
      dialog.addEventListener(
        "click",
        async function (event) {
          if (event.target === dialog) {
            dialog.close();
          }
        }
      );

      const commentSubmit =
        document.getElementById("memoryViewerCommentSubmit");

      const commentText =
        document.getElementById("memoryViewerCommentText");

      const commentFeedback =
        document.getElementById("memoryViewerCommentFeedback");

      if (commentSubmit && commentText) {
        commentSubmit.addEventListener(
          "click",
          async function () {
            const text =
              String(commentText.value || "").trim();

            if (!text) {
              if (commentFeedback) {
                commentFeedback.textContent =
                  "Add a comment before posting.";
              }

              commentText.focus();
              return;
            }

            commentSubmit.disabled = true;

            if (commentFeedback) {
              commentFeedback.textContent =
                "Saving comment...";
            }

            try {
              await window.DeerCampUniversalViewer.addComment(text);
              commentText.value = "";

              if (commentFeedback) {
                commentFeedback.textContent =
                  "Comment added.";
              }
            } catch (error) {
              console.error(
                "CampFeed comment could not be saved.",
                error
              );

              if (commentFeedback) {
                commentFeedback.textContent =
                  error.message ||
                  "Comment could not save. Please try again.";
              }
            } finally {
              commentSubmit.disabled = false;
            }
          }
        );
      }
      if (
        window.DeerCampUniversalViewer &&
        typeof window.DeerCampUniversalViewer.initialize === "function"
      ) {
        window.DeerCampUniversalViewer.initialize();
      } else {
        console.warn(
          "Universal Viewer is unavailable; continuing with the Premium Room Engine."
        );
      }
      completePendingEmailSignIn()
        .then(function () {
          return window.DeerCampPremiumEngine.initialize();
        })
        .catch(function (error) {
          console.error(
            "Premium CampFeed V2 initialization failed.",
            error
          );

          errorMessage.hidden = false;
          errorMessage.textContent =
            error.message ||
            "Premium CampFeed could not initialize.";
        });
    })();
  </script>
</body>
</html>
