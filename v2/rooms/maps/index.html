<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <title>Maps Room | DeerCamp V2</title>

  <link rel="stylesheet" href="../shared/room-shell.css" />
  <link rel="stylesheet" href="./maps-room.css" />
</head>

<body>

  <main
    class="room-shell maps-room"
    aria-label="DeerCamp Maps Room"
  >

    <section class="room-stage">

      <img
        class="room-art"
        src="./maps-room.png"
        alt="DeerCamp Maps Room"
      >
      <!-- VIEW -->

      <button
        class="room-hotspot hs-view hs-view-1"
        type="button"
        data-action-id="property-maps"
        aria-label="Property Maps"
      ></button>

      <button
        class="room-hotspot hs-view hs-view-2"
        type="button"
        data-action-id="stand-maps"
        aria-label="Stand Maps"
      ></button>

      <button
        class="room-hotspot hs-view hs-view-3"
        type="button"
        data-action-id="drive-maps"
        aria-label="Drive Maps"
      ></button>

      <button
        class="room-hotspot hs-view hs-view-4"
        type="button"
        data-action-id="deer-analytics"
        aria-label="Deer Analytics Map"
      ></button>

      <!-- SHARE -->

      <button
        class="room-hotspot hs-share hs-share-1"
        type="button"
        data-action-id="create-stand-map"
        aria-label="Create Stand Map"
      ></button>

      <button
        class="room-hotspot hs-share hs-share-2"
        type="button"
        data-action-id="create-drive-map"
        aria-label="Create Drive Map"
      ></button>

      <button
        class="room-hotspot hs-share hs-share-3"
        type="button"
        data-action-id="record-deer-count"
        aria-label="Record Deer Count"
      ></button>

      <button
        class="room-hotspot hs-share hs-share-4"
        type="button"
        data-action-id="export-map"
        aria-label="Export Map"
      ></button>

    </section>

  </main>

  <dialog
    id="mapsDialog"
    class="maps-dialog"
  >
    <div class="maps-dialog-panel">

      <button
        id="mapsDialogClose"
        class="maps-dialog-close"
        type="button"
        aria-label="Close"
      >
        &times;
      </button>

      <p
        id="mapsDialogEyebrow"
        class="maps-dialog-eyebrow"
      >
        Maps
      </p>

      <h2 id="mapsDialogTitle"></h2>

      <p id="mapsDialogMessage"></p>

    </div>
  </dialog>

  <script src="../shared/room-navigation.js"></script>
  <script src="./maps.js"></script>

</body>
</html>
