<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <title>CampFeed Room | DeerCamp V2</title>

  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-storage-compat.js"></script>
  <script src="../../../firebase-web.js"></script>

  <link rel="stylesheet" href="../premium-engine-v2/premium-engine.css?v=20260929-campfeed1" />

  <style>
    html,
    body {
      width: 100%;
      height: auto;
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;
      overflow-y: auto;
      background: #080604;
    }

    .premium-v2-shell {
      width: min(1100px, 82vw);
      height: auto;
      min-height: 0;
      margin: 0 auto;
      padding: 18px 0 24px;
      overflow: visible;
    }

    .premium-v2-stage {
      position: relative;
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }


    /* Dynamic camp identity badge over legacy artwork identity. */
    .premium-v2-stage .room-camp-identity {
      position:absolute;
      right:0.6%;
      top:0.7%;
      z-index:110;
      width:22.5%;
      min-height:9.6%;
      box-sizing:border-box;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:6%;
      padding:1.0% 1.5%;
      background:#090603;
      border:1px solid rgba(232,178,79,.55);
      border-radius:14px;
      box-shadow:
        0 10px 28px rgba(0,0,0,.45),
        inset 0 0 0 1px rgba(239,190,93,.10);
      overflow:hidden;
      pointer-events:none;
    }

    .premium-v2-stage .room-camp-identity-icon {
      display:block;
      width:24%;
      height:auto;
      flex:0 0 auto;
      border-radius:50%;
    }

    .premium-v2-stage .room-camp-identity-name {
      min-width:0;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:flex-start;
      line-height:1;
      text-shadow:0 2px 5px #000;
    }

    .premium-v2-stage .room-camp-identity-label {
      display:block;
      margin:0 0 3% 0;
      color:#c99743;
      font-family:Arial,Helvetica,sans-serif;
      font-size:clamp(7px,.70vw,11px);
      font-weight:700;
      letter-spacing:.24em;
    }

    .premium-v2-stage .room-camp-identity-name strong {
      display:block;
      max-width:100%;
      color:#f0c66f;
      font-family:Georgia,'Times New Roman',serif;
      font-size:clamp(10px,1.20vw,18px);
      font-weight:700;
      letter-spacing:.06em;
      line-height:1.05;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    #premiumRoomArtwork {
      display: block;
      width: 100%;
      height: auto;
      max-width: none;
      max-height: none;
      object-fit: contain;
      user-select: none;
      pointer-events: none;
    }

    .premium-v2-identity {
      display: none;
    }

    #premiumHotspotLayer {
      pointer-events: none;
    }

    #premiumHotspotLayer .premium-v2-hotspot,
    #premiumHotspotLayer .premium-v2-nav {
      pointer-events: auto;
    }

    /* Live CampFeed Stats overlay */
    .campfeed-stats-live {
      position: absolute;
      z-index: 11;
      left: 85.8%;
      top: 22.6%;
      width: 2.6%;
      height: 12.3%;
      pointer-events: none;
      color: #f1c77e;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 700;
      text-align: center;
    }

    .campfeed-stats-live-value {
      position: absolute;
      left: 0;
      width: 100%;
      box-sizing: border-box;
      background: rgb(20, 22, 14);
      font-size: clamp(9px, .92vw, 14px);
      line-height: 1.45;
      padding: 1px 0;
      transform: translateY(-4px);
    }

    #campfeedStatConversations { top: 0%; }
    #campfeedStatVoice { top: 17%; }
    #campfeedStatPhotos { top: 34%; }
    #campfeedStatMemories { top: 51%; }
    #campfeedStatWeek { top: 68%; }
    #campfeedStatToday { top: 85%; }
    .campfeed-live-window {
      position: absolute;
      z-index: 10;
      left: 24.8%;
      top: 17.8%;
      width: 50.4%;
      height: 29.0%;
      box-sizing: border-box;
      overflow: hidden;
      background: transparent;
      pointer-events: none;
    }

    #roomFeed {
      height: 100%;
      box-sizing: border-box;
      overflow: hidden;
      color: #f4e6c9;
    }

    #roomFeed .campfeed-live-card {
      box-sizing: border-box;
      position: relative;
      height: 33.333%;
      margin: 0;
      padding: 1.15% 2.2% .9% 39%;
      border: 0;
      background: linear-gradient(
        90deg,
        transparent 0 35%,
        rgb(4, 24, 23) 39% 100%
      );
    }

    #roomFeed .campfeed-live-card-audio,
    #roomFeed .campfeed-live-card-memory {
      pointer-events: auto;
      cursor: pointer;
    }

    #roomFeed .campfeed-live-card-audio:focus-visible,
    #roomFeed .campfeed-live-card-memory:focus-visible {
      outline: 2px solid #c99743;
      outline-offset: -2px;
    }
    #roomFeed .campfeed-live-image {
      position: absolute;
      z-index: 1;
      left: 0;
      top: 8%;
      width: 35%;
      height: 84%;
      object-fit: cover;
      border-radius: 8px;
      pointer-events: auto;
      cursor: pointer;
    }
    #roomFeed .campfeed-live-image:focus-visible {
      outline: 2px solid #c99743;
      outline-offset: 2px;
    }
    #roomFeed .campfeed-live-content {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-width: 0;
      overflow: hidden;
    }

    #roomFeed .campfeed-live-identity {
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 4px;
      min-width: 0;
      margin-bottom: 3px;
    }

    #roomFeed .campfeed-live-avatar {
      width: 18px;
      height: 18px;
      border: 1px solid rgba(213, 151, 25, .9);
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 35%, #d6b06a 0 18%, transparent 20%),
        radial-gradient(circle at 50% 88%, #8a6231 0 34%, #1b3430 36% 100%);
    }

    #roomFeed .campfeed-live-author {
      min-width: 0;
      overflow: hidden;
      color: #f2dfbd;
      font-size: clamp(8px, .72vw, 11px);
      font-weight: 700;
      line-height: 1.1;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #roomFeed .campfeed-live-room {
      display: inline-block;
      max-width: 86px;
      padding: 1px 5px;
      overflow: hidden;
      border: 1px solid rgba(213, 151, 25, .9);
      border-radius: 4px;
      color: #e0aa28;
      font-size: clamp(6px, .54vw, 8px);
      font-weight: 700;
      line-height: 1.15;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #roomFeed .campfeed-live-when {
      color: #bba98b;
      font-size: clamp(6px, .52vw, 8px);
      line-height: 1.1;
      text-align: right;
      white-space: nowrap;
    }

    #roomFeed h3 {
      margin: 0 0 2px;
      overflow: hidden;
      color: #f1c77e;
      font-size: clamp(10px, 1.05vw, 15px);
      line-height: 1.08;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #roomFeed p {
      display: -webkit-box;
      margin: 0;
      overflow: hidden;
      color: #ead8b7;
      font-size: clamp(7px, .67vw, 10px);
      line-height: 1.18;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    #roomFeed .campfeed-live-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: auto;
      padding-top: 3px;
      border-top: 1px solid rgba(201, 151, 67, .24);
      color: #a99879;
      font-size: clamp(6px, .52vw, 8px);
      line-height: 1;
    }

    #roomFeed .campfeed-live-actions span:last-child {
      margin-left: auto;
      letter-spacing: 1px;
    }
    /* Artwork-scale refinement for live CampFeed rows */
    #roomFeed .campfeed-live-identity {
      grid-template-columns: 24px minmax(0, 1fr) auto auto;
      gap: 5px;
      margin-bottom: 4px;
    }

    #roomFeed .campfeed-live-avatar {
      width: 22px;
      height: 22px;
    }

    #roomFeed .campfeed-live-author {
      font-size: clamp(10px, .90vw, 14px);
    }

    #roomFeed .campfeed-live-room {
      max-width: 104px;
      padding: 2px 7px;
      font-size: clamp(7px, .66vw, 10px);
    }

    #roomFeed .campfeed-live-when {
      font-size: clamp(7px, .62vw, 9px);
    }

    #roomFeed h3 {
      margin-bottom: 3px;
      font-size: clamp(13px, 1.32vw, 19px);
    }

    #roomFeed p {
      font-size: clamp(9px, .84vw, 12px);
      line-height: 1.45;
      padding: 4px 0 3px;
      transform: translateY(-4px);
    }

    #roomFeed .campfeed-live-actions {
      gap: 13px;
      padding-top: 4px;
      font-size: clamp(7px, .64vw, 10px);
    }
    @media (max-width: 700px) {
      .premium-v2-shell {
        width: calc(100vw - 12px);
        margin: 0 auto;
        padding: 6px 0 12px;
      }

    }

    /* CampFeed share dialog form layout */
    #premiumActionDialog #premiumAuthForm,
    #premiumActionDialog #campfeedTextForm,
    #premiumActionDialog #campfeedPhotoForm,
    #premiumActionDialog #campfeedVoiceForm,
    #premiumActionDialog #campfeedMemoryForm {
      margin-top: 22px;
    }

    #premiumActionDialog #premiumAuthForm:not([hidden]),
    #premiumActionDialog #campfeedTextForm:not([hidden]),
    #premiumActionDialog #campfeedPhotoForm:not([hidden]),
    #premiumActionDialog #campfeedVoiceForm:not([hidden]),
    #premiumActionDialog #campfeedMemoryForm:not([hidden]) {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #premiumActionDialog label {
      margin-top: 4px;
      font-weight: 700;
      color: #f4e6c9;
    }

    #premiumActionDialog input,
    #premiumActionDialog textarea {
      box-sizing: border-box;
      width: 100%;
      padding: 11px 12px;
      border: 1px solid rgba(201, 151, 67, 0.55);
      border-radius: 9px;
      background: rgba(0, 0, 0, 0.28);
      color: #f4e6c9;
      font: inherit;
    }

    #premiumActionDialog textarea {
      resize: vertical;
      line-height: 1.45;
      padding: 4px 0 3px;
      transform: translateY(-4px);
    }

    #premiumActionDialog input:focus,
    #premiumActionDialog textarea:focus {
      outline: 2px solid #c99743;
      outline-offset: 1px;
    }

    #premiumActionDialog #campfeedVoicePreview {
      box-sizing: border-box;
      width: 100%;
      margin-top: 4px;
    }

    #premiumActionDialog #premiumAuthSendLink,
    #premiumActionDialog #campfeedTextPublish,
    #premiumActionDialog #campfeedPhotoPublish,
    #premiumActionDialog #campfeedVoiceRecord,
    #premiumActionDialog #campfeedVoicePublish {
      align-self: flex-start;
      min-height: 42px;
      margin-top: 6px;
      padding: 9px 16px;
      border: 1px solid #c99743;
      border-radius: 999px;
      background: rgba(201, 151, 67, 0.14);
      color: #f4e6c9;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    #premiumActionDialog #campfeedVoicePublish:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #premiumActionDialog #campfeedShareFeedback {
      min-height: 1.5em;
    }
  </style>
</head>

<body>
  <main class="premium-v2-shell">
    <section class="premium-v2-stage" aria-label="DeerCamp CampFeed Room">
      <img id="premiumRoomArtwork" class="premium-v2-artwork" alt="" />
      <div class="room-camp-identity" data-camp-identity aria-label="Loading camp identity">
        <img
          class="room-camp-identity-icon"
          src="../../../assets/branding/deercamp-circle-icon.png"
          alt=""
          aria-hidden="true"
        >
        <div class="room-camp-identity-name">
          <span class="room-camp-identity-label">CAMP</span>
          <strong data-camp-identity-name>Loading...</strong>
        </div>
      </div>

      <div class="campfeed-stats-live" aria-label="Live CampFeed statistics">
        <span id="campfeedStatConversations" class="campfeed-stats-live-value">0</span>
        <span id="campfeedStatVoice" class="campfeed-stats-live-value">0</span>
        <span id="campfeedStatPhotos" class="campfeed-stats-live-value">0</span>
        <span id="campfeedStatMemories" class="campfeed-stats-live-value">0</span>
        <span id="campfeedStatWeek" class="campfeed-stats-live-value">0</span>
        <span id="campfeedStatToday" class="campfeed-stats-live-value">0</span>
      </div>
      <section class="campfeed-live-window" aria-label="Live CampFeed activity">
        <div id="roomFeed"></div>
      </section>

      <div id="premiumHotspotLayer" class="premium-v2-hotspot-layer" aria-label="CampFeed Room navigation"></div>
    </section>

    <div class="premium-v2-identity">
      <strong id="premiumCampName">Loading camp...</strong>
      <span id="premiumCampLocation"></span>
    </div>

    <span id="premiumCampId" hidden></span>
    <span id="premiumDataSource" hidden></span>
    <span id="premiumFirebaseProject" hidden></span>
  </main>

<dialog id="universalViewer" class="universal-viewer" aria-label="DeerCamp Memory Viewer">
    <div class="memory-viewer-shell">
      <header class="memory-viewer-header">
        <div>
          <p id="memoryViewerKicker" class="memory-viewer-kicker">MEMORY VIEWER</p>
          <h2 id="memoryViewerCollectionTitle" class="memory-viewer-collection-title">DeerCamp Memories</h2>
        </div>
        <button id="universalViewerClose" class="universal-viewer-close" type="button">Close</button>
      </header>

      <div id="memoryViewerBody" class="memory-viewer-body">
        <div id="memoryViewerEmpty" class="memory-viewer-empty" hidden></div>
        <div id="memoryViewerContent" class="memory-viewer-content">
          <section class="memory-viewer-hero-column">
            <div id="memoryViewerHeroFrame" class="memory-viewer-hero-frame">
              <img id="memoryViewerHero" class="memory-viewer-hero" alt="" hidden />
              <div id="memoryViewerHeroPlaceholder" class="memory-viewer-hero-placeholder">DeerCamp memory</div>
            </div>
          </section>

          <section class="memory-viewer-detail-column">
            <h2 id="memoryViewerItemTitle" class="memory-viewer-item-title">Memory title</h2>
            <p id="memoryViewerSubtitle" class="memory-viewer-subtitle"></p>
            <div class="memory-viewer-byline">
              <span id="memoryViewerAuthor"></span>
              <span id="memoryViewerRoom"></span>
              <span id="memoryViewerTimestamp"></span>
            </div>

            <section
              id="memoryViewerStewardActions"
              class="memory-viewer-section"
              hidden
            >
              <button
                id="memoryViewerRemovePost"
                class="memory-viewer-nav-button"
                type="button"
              >
                Remove Post
              </button>
              <p
                id="memoryViewerRemoveFeedback"
                class="memory-viewer-comment-feedback"
                aria-live="polite"
              ></p>
            </section>

            <section id="memoryViewerAudioSection" class="memory-viewer-section" hidden>
              <h3>Listen</h3>
              <audio id="memoryViewerAudio" class="memory-viewer-audio" controls preload="metadata"></audio>
            </section>

            <section id="memoryViewerTranscriptSection" class="memory-viewer-section">
              <h3>Story</h3>
              <p id="memoryViewerTranscript" class="memory-viewer-transcript"></p>
            </section>

            <section id="memoryViewerCommentsSection" class="memory-viewer-section">
              <h3>Camp Comments</h3>
              <div id="memoryViewerComments" class="memory-viewer-comments"></div>

              <div class="memory-viewer-comment-form">
                <label for="memoryViewerCommentText">Add a comment</label>
                <textarea
                  id="memoryViewerCommentText"
                  rows="3"
                  maxlength="1000"
                  placeholder="Add a comment about this CampFeed post."
                ></textarea>
                <button
                  id="memoryViewerCommentSubmit"
                  class="memory-viewer-nav-button"
                  type="button"
                >
                  Add Comment
                </button>
                <p
                  id="memoryViewerCommentFeedback"
                  class="memory-viewer-comment-feedback"
                  aria-live="polite"
                ></p>
              </div>
            </section>

            <section id="memoryViewerTagsSection" class="memory-viewer-section" hidden>
              <h3>Tags</h3>
              <div id="memoryViewerTags" class="memory-viewer-tags"></div>
            </section>

            <section id="memoryViewerMetadataSection" class="memory-viewer-section" hidden>
              <h3>Memory Details</h3>
              <div id="memoryViewerMetadata" class="memory-viewer-metadata"></div>
            </section>
          </section>
        </div>
      </div>

      <footer class="memory-viewer-footer">
        <button id="memoryViewerPrevious" class="memory-viewer-nav-button" type="button">Previous</button>
        <span id="memoryViewerPosition" class="memory-viewer-position">1 of 1</span>
        <button id="memoryViewerNext" class="memory-viewer-nav-button" type="button">Next</button>
      </footer>
    </div>
  </dialog>

  <dialog id="premiumActionDialog" class="premium-v2-dialog">
    <div class="premium-v2-dialog-card">
      <button id="premiumDialogClose" class="premium-v2-dialog-close" type="button">Close</button>

      <h2 id="premiumDialogTitle">Sign in to DeerCamp</h2>
      <p id="premiumDialogMessage">Sign in to view this private CampFeed.</p>

      <div id="premiumAuthForm">
        <label for="premiumAuthEmail">Email</label>
        <input
          id="premiumAuthEmail"
          type="email"
          autocomplete="email"
          placeholder="you@example.com"
        />

        <button id="premiumAuthSendLink" type="button">Send Sign-In Link</button>

        <p id="premiumAuthFeedback" aria-live="polite"></p>
      </div>

      <div id="campfeedTextForm" hidden>
        <label for="campfeedTitle">Title</label>
        <input id="campfeedTitle" type="text" maxlength="140" />

        <label for="campfeedBody">Story or thought</label>
        <textarea id="campfeedBody" rows="6" maxlength="4000"></textarea>

        <button id="campfeedTextPublish" type="button">
          Share to CampFeed
        </button>
      </div>

      <div id="campfeedPhotoForm" hidden>
        <label for="campfeedPhotoFile">Photo</label>
        <input id="campfeedPhotoFile" type="file" accept="image/*" />

        <label for="campfeedPhotoCaption">Caption</label>
        <textarea id="campfeedPhotoCaption" rows="4" maxlength="1000" placeholder="What happened?"></textarea>

        <button id="campfeedPhotoPublish" type="button">
          Share Photo
        </button>
      </div>

      <div id="campfeedVoiceForm" hidden>
        <label for="campfeedVoiceTitle">Story title</label>
        <input id="campfeedVoiceTitle" type="text" maxlength="140" placeholder="Voice Story" />

        <label for="campfeedVoiceBody">Optional note</label>
        <textarea id="campfeedVoiceBody" rows="3" maxlength="1000"></textarea>

        <button id="campfeedVoiceRecord" type="button">
          Start Recording
        </button>

        <audio id="campfeedVoicePreview" controls hidden></audio>

        <button id="campfeedVoicePublish" type="button" disabled>
          Share Voice Story
        </button>
      </div>

      <div id="campfeedMemoryForm" hidden>
        <label for="campfeedMemoryTitle">Story Title</label>
        <input id="campfeedMemoryTitle" type="text" maxlength="140" />

        <label for="campfeedMemoryBody">Story</label>
        <textarea id="campfeedMemoryBody" rows="6" maxlength="4000" placeholder="Write the camp memory or story you want preserved..."></textarea>

        <label for="campfeedMemoryFile">Optional Picture</label>
        <input id="campfeedMemoryFile" type="file" accept="image/*" />

        <button id="campfeedMemoryPublish" type="button">
          Share Memory / Story
        </button>
      </div>
      <p id="campfeedShareFeedback" aria-live="polite"></p>
    </div>
  </dialog>

  <script src="./room-config.js?v=20260929-campfeed1"></script>
  <script src="../premium-engine-v2/premium-engine.js?v=20260929-campfeed1"></script>
  <script src="../premium-engine-v2/universal-viewer.js"></script>
<script src="../premium-engine-v2/firestore-adapter.js"></script>
<script src="../premium-engine-v2/viewer-state.js"></script>
<script src="../premium-engine-v2/memory-provider.js"></script>
<script src="./campfeed.js?v=20260929-campfeed1"></script>
</body>
</html>
