<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <title>CampFeed Room | DeerCamp V2</title>

  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-storage-compat.js"></script>
  <script src="../../../firebase-web.js"></script>

  <link rel="stylesheet" href="../premium-engine-v2/premium-engine.css?v=20260929-campfeed1" />

  <style>
    html,
    body {
      width: 100%;
      height: auto;
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;
      overflow-y: auto;
      background: #080604;
    }

    .premium-v2-shell {
      width: min(1100px, 82vw);
      height: auto;
      min-height: 0;
      margin: 0 auto;
      padding: 18px 0 24px;
      overflow: visible;
    }

    .premium-v2-stage {
      position: relative;
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    #premiumRoomArtwork {
      display: block;
      width: 100%;
      height: auto;
      max-width: none;
      max-height: none;
      object-fit: contain;
      user-select: none;
      pointer-events: none;
    }

    .premium-v2-identity {
      display: none;
    }

    #premiumHotspotLayer {
      pointer-events: none;
    }

    #premiumHotspotLayer .premium-v2-hotspot,
    #premiumHotspotLayer .premium-v2-nav {
      pointer-events: auto;
    }

    .campfeed-live-window {
      position: absolute;
      z-index: 10;
      left: 24.8%;
      top: 17.8%;
      width: 50.4%;
      height: 29.0%;
      box-sizing: border-box;
      overflow: hidden;
      background: transparent;
      pointer-events: none;
    }

    #roomFeed {
      height: 100%;
      box-sizing: border-box;
      overflow: hidden;
      color: #f4e6c9;
    }

    #roomFeed .campfeed-live-card {
      box-sizing: border-box;
      position: relative;
      height: 33.333%;
      margin: 0;
      padding: 1.15% 2.2% .9% 39%;
      border: 0;
      background: linear-gradient(
        90deg,
        transparent 0 35%,
        rgb(4, 24, 23) 39% 100%
      );
    }

    #roomFeed .campfeed-live-card-audio {
      pointer-events: auto;
      cursor: pointer;
    }

    #roomFeed .campfeed-live-card-audio:focus-visible {
      outline: 2px solid #c99743;
      outline-offset: -2px;
    }
    #roomFeed .campfeed-live-image {
      position: absolute;
      z-index: 1;
      left: 0;
      top: 8%;
      width: 35%;
      height: 84%;
      object-fit: cover;
      border-radius: 8px;
      pointer-events: auto;
      cursor: pointer;
    }
    #roomFeed .campfeed-live-image:focus-visible {
      outline: 2px solid #c99743;
      outline-offset: 2px;
    }
    #roomFeed .campfeed-live-content {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-width: 0;
      overflow: hidden;
    }

    #roomFeed .campfeed-live-identity {
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 4px;
      min-width: 0;
      margin-bottom: 3px;
    }

    #roomFeed .campfeed-live-avatar {
      width: 18px;
      height: 18px;
      border: 1px solid rgba(213, 151, 25, .9);
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 35%, #d6b06a 0 18%, transparent 20%),
        radial-gradient(circle at 50% 88%, #8a6231 0 34%, #1b3430 36% 100%);
    }

    #roomFeed .campfeed-live-author {
      min-width: 0;
      overflow: hidden;
      color: #f2dfbd;
      font-size: clamp(8px, .72vw, 11px);
      font-weight: 700;
      line-height: 1.1;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #roomFeed .campfeed-live-room {
      display: inline-block;
      max-width: 86px;
      padding: 1px 5px;
      overflow: hidden;
      border: 1px solid rgba(213, 151, 25, .9);
      border-radius: 4px;
      color: #e0aa28;
      font-size: clamp(6px, .54vw, 8px);
      font-weight: 700;
      line-height: 1.15;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #roomFeed .campfeed-live-when {
      color: #bba98b;
      font-size: clamp(6px, .52vw, 8px);
      line-height: 1.1;
      text-align: right;
      white-space: nowrap;
    }

    #roomFeed h3 {
      margin: 0 0 2px;
      overflow: hidden;
      color: #f1c77e;
      font-size: clamp(10px, 1.05vw, 15px);
      line-height: 1.08;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #roomFeed p {
      display: -webkit-box;
      margin: 0;
      overflow: hidden;
      color: #ead8b7;
      font-size: clamp(7px, .67vw, 10px);
      line-height: 1.18;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    #roomFeed .campfeed-live-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: auto;
      padding-top: 3px;
      border-top: 1px solid rgba(201, 151, 67, .24);
      color: #a99879;
      font-size: clamp(6px, .52vw, 8px);
      line-height: 1;
    }

    #roomFeed .campfeed-live-actions span:last-child {
      margin-left: auto;
      letter-spacing: 1px;
    }
    /* Artwork-scale refinement for live CampFeed rows */
    #roomFeed .campfeed-live-identity {
      grid-template-columns: 24px minmax(0, 1fr) auto auto;
      gap: 5px;
      margin-bottom: 4px;
    }

    #roomFeed .campfeed-live-avatar {
      width: 22px;
      height: 22px;
    }

    #roomFeed .campfeed-live-author {
      font-size: clamp(10px, .90vw, 14px);
    }

    #roomFeed .campfeed-live-room {
      max-width: 104px;
      padding: 2px 7px;
      font-size: clamp(7px, .66vw, 10px);
    }

    #roomFeed .campfeed-live-when {
      font-size: clamp(7px, .62vw, 9px);
    }

    #roomFeed h3 {
      margin-bottom: 3px;
      font-size: clamp(13px, 1.32vw, 19px);
    }

    #roomFeed p {
      font-size: clamp(9px, .84vw, 12px);
      line-height: 1.2;
    }

    #roomFeed .campfeed-live-actions {
      gap: 13px;
      padding-top: 4px;
      font-size: clamp(7px, .64vw, 10px);
    }
    @media (max-width: 700px) {
      .premium-v2-shell {
        width: calc(100vw - 12px);
        margin: 0 auto;
        padding: 6px 0 12px;
      }

    }
  </style>
</head>

<body>
  <main class="premium-v2-shell">
    <section class="premium-v2-stage" aria-label="DeerCamp CampFeed Room">
      <img id="premiumRoomArtwork" class="premium-v2-artwork" alt="" />

      <section class="campfeed-live-window" aria-label="Live CampFeed activity">
        <div id="roomFeed"></div>
      </section>

      <div id="premiumHotspotLayer" class="premium-v2-hotspot-layer" aria-label="CampFeed Room navigation"></div>
    </section>

    <div class="premium-v2-identity">
      <strong id="premiumCampName">Loading camp...</strong>
      <span id="premiumCampLocation"></span>
    </div>

    <span id="premiumCampId" hidden></span>
    <span id="premiumDataSource" hidden></span>
    <span id="premiumFirebaseProject" hidden></span>
  </main>

<dialog id="universalViewer" class="universal-viewer" aria-label="DeerCamp Memory Viewer">
    <div class="memory-viewer-shell">
      <header class="memory-viewer-header">
        <div>
          <p id="memoryViewerKicker" class="memory-viewer-kicker">MEMORY VIEWER</p>
          <h2 id="memoryViewerCollectionTitle" class="memory-viewer-collection-title">DeerCamp Memories</h2>
        </div>
        <button id="universalViewerClose" class="universal-viewer-close" type="button">Close</button>
      </header>

      <div id="memoryViewerBody" class="memory-viewer-body">
        <div id="memoryViewerEmpty" class="memory-viewer-empty" hidden></div>
        <div id="memoryViewerContent" class="memory-viewer-content">
          <section class="memory-viewer-hero-column">
            <div id="memoryViewerHeroFrame" class="memory-viewer-hero-frame">
              <img id="memoryViewerHero" class="memory-viewer-hero" alt="" hidden />
              <div id="memoryViewerHeroPlaceholder" class="memory-viewer-hero-placeholder">DeerCamp memory</div>
            </div>
          </section>

          <section class="memory-viewer-detail-column">
            <h2 id="memoryViewerItemTitle" class="memory-viewer-item-title">Memory title</h2>
            <p id="memoryViewerSubtitle" class="memory-viewer-subtitle"></p>
            <div class="memory-viewer-byline">
              <span id="memoryViewerAuthor"></span>
              <span id="memoryViewerRoom"></span>
              <span id="memoryViewerTimestamp"></span>
            </div>

            <section
              id="memoryViewerStewardActions"
              class="memory-viewer-section"
              hidden
            >
              <button
                id="memoryViewerRemovePost"
                class="memory-viewer-nav-button"
                type="button"
              >
                Remove Post
              </button>
              <p
                id="memoryViewerRemoveFeedback"
                class="memory-viewer-comment-feedback"
                aria-live="polite"
              ></p>
            </section>

            <section id="memoryViewerAudioSection" class="memory-viewer-section" hidden>
              <h3>Listen</h3>
              <audio id="memoryViewerAudio" class="memory-viewer-audio" controls preload="metadata"></audio>
            </section>

            <section id="memoryViewerTranscriptSection" class="memory-viewer-section">
              <h3>Story</h3>
              <p id="memoryViewerTranscript" class="memory-viewer-transcript"></p>
            </section>

            <section id="memoryViewerCommentsSection" class="memory-viewer-section">
              <h3>Camp Comments</h3>
              <div id="memoryViewerComments" class="memory-viewer-comments"></div>

              <div class="memory-viewer-comment-form">
                <label for="memoryViewerCommentText">Add a comment</label>
                <textarea
                  id="memoryViewerCommentText"
                  rows="3"
                  maxlength="1000"
                  placeholder="Add a comment about this CampFeed post."
                ></textarea>
                <button
                  id="memoryViewerCommentSubmit"
                  class="memory-viewer-nav-button"
                  type="button"
                >
                  Add Comment
                </button>
                <p
                  id="memoryViewerCommentFeedback"
                  class="memory-viewer-comment-feedback"
                  aria-live="polite"
                ></p>
              </div>
            </section>

            <section id="memoryViewerTagsSection" class="memory-viewer-section" hidden>
              <h3>Tags</h3>
              <div id="memoryViewerTags" class="memory-viewer-tags"></div>
            </section>

            <section id="memoryViewerMetadataSection" class="memory-viewer-section" hidden>
              <h3>Memory Details</h3>
              <div id="memoryViewerMetadata" class="memory-viewer-metadata"></div>
            </section>
          </section>
        </div>
      </div>

      <footer class="memory-viewer-footer">
        <button id="memoryViewerPrevious" class="memory-viewer-nav-button" type="button">ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â Ãƒâ€šÃ‚Â Previous</button>
        <span id="memoryViewerPosition" class="memory-viewer-position">1 of 1</span>
        <button id="memoryViewerNext" class="memory-viewer-nav-button" type="button">Next ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â ÃƒÂ¢Ã¢â€šÂ¬Ã¢â€žÂ¢</button>
      </footer>
    </div>
  </dialog>

  <dialog id="premiumActionDialog" class="premium-v2-dialog">
    <div class="premium-v2-dialog-card">
      <button id="premiumDialogClose" class="premium-v2-dialog-close" type="button">Close</button>

      <h2 id="premiumDialogTitle">Sign in to DeerCamp</h2>
      <p id="premiumDialogMessage">Sign in to view this private CampFeed.</p>

      <div id="premiumAuthForm">
        <label for="premiumAuthEmail">Email</label>
        <input
          id="premiumAuthEmail"
          type="email"
          autocomplete="email"
          placeholder="you@example.com"
        />

        <button id="premiumAuthSendLink" type="button">Send Sign-In Link</button>

        <p id="premiumAuthFeedback" aria-live="polite"></p>
      </div>

      <div id="campfeedTextForm" hidden>
        <label for="campfeedTitle">Title</label>
        <input id="campfeedTitle" type="text" maxlength="140" />

        <label for="campfeedBody">Story or thought</label>
        <textarea id="campfeedBody" rows="6" maxlength="4000"></textarea>

        <button id="campfeedTextPublish" type="button">
          Share to CampFeed
        </button>
      </div>

      <div id="campfeedPhotoForm" hidden>
        <label for="campfeedPhotoFile">Photo</label>
        <input id="campfeedPhotoFile" type="file" accept="image/*" />

        <label for="campfeedPhotoCaption">Caption</label>
        <textarea id="campfeedPhotoCaption" rows="4" maxlength="1000" placeholder="What happened?"></textarea>

        <button id="campfeedPhotoPublish" type="button">
          Share Photo
        </button>
      </div>

      <div id="campfeedVoiceForm" hidden>
        <label for="campfeedVoiceTitle">Story title</label>
        <input id="campfeedVoiceTitle" type="text" maxlength="140" placeholder="Voice Story" />

        <label for="campfeedVoiceBody">Optional note</label>
        <textarea id="campfeedVoiceBody" rows="3" maxlength="1000"></textarea>

        <button id="campfeedVoiceRecord" type="button">
          Start Recording
        </button>

        <audio id="campfeedVoicePreview" controls hidden></audio>

        <button id="campfeedVoicePublish" type="button" disabled>
          Share Voice Story
        </button>
      </div>

      <p id="campfeedShareFeedback" aria-live="polite"></p>
    </div>
  </dialog>

  <script src="./room-config.js?v=20260929-campfeed1"></script>
  <script src="../premium-engine-v2/premium-engine.js?v=20260929-campfeed1"></script>
  <script src="../premium-engine-v2/universal-viewer.js"></script>
<script src="../premium-engine-v2/firestore-adapter.js"></script>
<script src="../premium-engine-v2/viewer-state.js"></script>
<script src="../premium-engine-v2/memory-provider.js"></script>
<script src="./campfeed.js?v=20260929-campfeed1"></script>
</body>
</html>
