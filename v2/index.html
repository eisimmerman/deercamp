<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <title>DeerCamp V2</title>

  <script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore-compat.js"></script>
  <script src="../firebase-web.js"></script>

  <link rel="stylesheet" href="./shared/v2-shell.css" />
</head>

<body>
  <main class="v2-shell">
    <section class="v2-arrival" aria-labelledby="campTitle">
      <div class="v2-brand">DEERCAMP V2</div>

      <p class="v2-kicker">Your camp is ready</p>

      <h1 id="campTitle">Loading your DeerCamp...</h1>

      <p id="campLocation" class="v2-location"></p>

      <div class="v2-status-card">
        <div>
          <span class="v2-status-label">Camp ID</span>
          <strong id="campIdValue">Resolving...</strong>
        </div>

        <div>
          <span class="v2-status-label">Steward</span>
          <strong id="stewardValue">Loading...</strong>
        </div>

        <div>
          <span class="v2-status-label">Data source</span>
          <strong id="dataSourceValue">Connecting...</strong>
        </div>

        <div>
          <span class="v2-status-label">Firebase project</span>
          <strong id="firebaseProjectValue">Resolving...</strong>
        </div>
      </div>

      <p id="loadMessage" class="v2-message" role="status">
        Preparing your room-based DeerCamp experience...
      </p>

      <div class="v2-actions">
        <a id="continueV2Btn" class="v2-button v2-button-primary" href="#">
          Enter DeerCamp V2
        </a>

        <a id="dashboardBtn" class="v2-button" href="../steward-dashboard.html">
          Steward Dashboard
        </a>

        <a id="v1Btn" class="v2-button" href="../camp.html">
          View Current Camp
        </a>
      </div>
    </section>
  </main>

  <script src="./shared/v2-shell.js"></script>
</body>
</html>
