<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Camp Boddington Maps Room</title>
<link rel="stylesheet" href="./maps-room.css?v=20260802-final-field-guidance">
</head>
<body>
<main class="maps-room">
  <section class="room-stage">
    <img class="room-art" src="./maps-room.png" alt="Camp Boddington Maps Room">
    <button
      class="room-hotspot hs-view-stand-maps"
      type="button"
      data-action="open-stand-list"
      aria-label="Open Stand Maps"
      data-tooltip="Open Stand Maps">
    </button>    <button class="room-hotspot hs-stand-maps" type="button"
      data-action="open-stand-list" aria-label="Open Stand Maps"
      data-tooltip="Open Stand Maps"></button>
    <button
      class="room-hotspot hs-drive-maps"
      type="button"
      data-action="open-drive-list"
      aria-label="Open Drive Maps"
      data-tooltip="Open Drive Maps">
    </button>

    <button
      class="room-hotspot hs-view-drive-maps"
      type="button"
      data-action="open-drive-list"
      aria-label="Open Drive Maps"
      data-tooltip="Open Drive Maps">
    </button>
    <button
      class="room-hotspot hs-create-stand-map"
      type="button"
      data-action="create-stand-map"
      aria-label="Create Stand Map"
      data-tooltip="Create Stand Map">
    </button>
  </section>
</main>
<div class="modal-layer" data-modal-layer hidden>
  <div class="modal-backdrop" data-modal-close></div>
  <section class="modal-shell" role="dialog" aria-modal="true">
    <button class="modal-close" type="button" data-modal-close aria-label="Close">X</button>
    <div class="modal-content" data-modal-content></div>
  </section>
</div>
<script src="./maps-room.js?v=20260802-create-stand-guidance"></script>
<script id="maps-final-guidance-controller">
(function(){
  "use strict";

  const room = document.querySelector(".maps-room");
  const modalLayer = document.querySelector("[data-modal-layer]");
  const modalContent = document.querySelector("[data-modal-content]");

  if(!room) return;

  let activeExperience = "";
  let previousModalOpen = false;

  function showStandGuidance(){
    room.classList.remove(
      "maps-guide-drive",
      "maps-guide-complete"
    );

    room.classList.add("maps-guide-stand");
  }

  function showDriveGuidance(){
    room.classList.remove(
      "maps-guide-stand",
      "maps-guide-complete"
    );

    room.classList.add("maps-guide-drive");
  }

  function completeGuidance(){
    room.classList.remove(
      "maps-guide-stand",
      "maps-guide-drive",
      "maps-guide-complete"
    );

    room.classList.add("maps-guide-create");
  }

  function driveLegendMarkup(){
    return `
      <div class="drive-role-legend">
        <strong>Legend</strong>

        <span class="drive-role-item">
          <span class="drive-role-dot blue"></span>
          Blue circle = Driver/Pusher
        </span>

        <span class="drive-role-item">
          <span class="drive-role-dot yellow"></span>
          Yellow circle = Stander/Blocker
        </span>
      </div>
    `;
  }

  function ensureDriveLegend(){
    if(!modalContent) return;

    const text = modalContent.textContent || "";

    if(
      !/Triangle Deer Drive|Driver\/Pusher Route 1/i.test(text)
    ){
      return;
    }

    /*
     * Remove earlier or malformed legend versions so only the
     * final blue/yellow legend remains.
     */
    modalContent
      .querySelectorAll(
        ".drive-role-legend, .drive-map-legend"
      )
      .forEach(element=>element.remove());

    const helper =
      modalContent.querySelector(".drive-map-helper");

    const mapButton =
      modalContent.querySelector(
        ".drive-map-image-button"
      );

    const holder = document.createElement("div");
    holder.innerHTML = driveLegendMarkup().trim();

    const legend = holder.firstElementChild;

    if(helper){
      helper.insertAdjacentElement("afterend",legend);
    }
    else if(mapButton){
      mapButton.insertAdjacentElement("afterend",legend);
    }
    else{
      modalContent.prepend(legend);
    }
  }

  /*
   * Detect which guided experience Craig selected.
   */
  document.addEventListener("click",function(event){
    const standButton = event.target.closest(
      '.hs-stand-maps, .hs-view-stand-maps'
    );

    if(standButton){
      activeExperience = "stand";

      room.classList.remove(
        "maps-guide-stand",
        "maps-guide-drive"
      );

      return;
    }

    const driveButton = event.target.closest(
      '.hs-drive-maps, .hs-view-drive-maps'
    );

    if(driveButton){
      activeExperience = "drive";

      room.classList.remove(
        "maps-guide-stand",
        "maps-guide-drive"
      );

      window.setTimeout(ensureDriveLegend,50);
    }
  },true);

  /*
   * Watch both modal opening/closing and modal HTML replacement.
   */
  if(modalLayer){
    const modalObserver = new MutationObserver(function(){
      const modalOpen = !modalLayer.hidden;

      if(modalOpen){
        window.setTimeout(ensureDriveLegend,0);
      }

      /*
       * The modal changed from open to closed.
       */
      if(previousModalOpen && !modalOpen){
        if(activeExperience === "stand"){
          activeExperience = "";
          window.setTimeout(showDriveGuidance,250);
        }
        else if(activeExperience === "drive"){
          activeExperience = "";
          completeGuidance();
        }
      }

      previousModalOpen = modalOpen;
    });

    modalObserver.observe(modalLayer,{
      attributes:true,
      attributeFilter:["hidden"],
      childList:true,
      subtree:true
    });

    previousModalOpen = !modalLayer.hidden;
  }

  if(modalContent){
    const contentObserver = new MutationObserver(function(){
      window.setTimeout(ensureDriveLegend,0);
    });

    contentObserver.observe(modalContent,{
      childList:true,
      subtree:true
    });
  }

  /*
   * Every page entry or refresh begins with Stand Maps.
   */
  showStandGuidance();
})();
</script>
<script id="create-stand-map-controller">
(function(){
  "use strict";

  const room = document.querySelector(".maps-room");
  const modalLayer =
    document.querySelector("[data-modal-layer]");
  const modalContent =
    document.querySelector("[data-modal-content]");

  if(!room || !modalLayer || !modalContent) return;

  const storageKey =
    "campBoddington.maps.createdStand";

  const standLocation = {
    label:"South Texas Hill Country waypoint",
    coordinates:"29.47362, -99.74128"
  };

  function showModal(html){
    modalContent.innerHTML = html;
    modalLayer.hidden = false;
    document.body.style.overflow = "hidden";
  }

  function closeModal(){
    modalLayer.hidden = true;
    modalContent.innerHTML = "";
    document.body.style.overflow = "";
  }

  function readSavedStand(){
    try{
      return JSON.parse(
        localStorage.getItem(storageKey) || "null"
      );
    }
    catch(error){
      return null;
    }
  }

  function openCreateStandMap(){
    const saved = readSavedStand();

    showModal(`
      <section class="create-stand-map-experience">
        <header class="create-stand-map-header">
          <div>
            <p class="eyebrow">Create Stand Map</p>
            <h2>South Texas Hill Country</h2>

            <p class="create-stand-instruction">
              ${
                saved
                  ? "Hover over X to review your stand summary."
                  : "Tap X to place stand and add details."
              }
            </p>
          </div>
        </header>

        <div class="create-stand-map-frame">
          <img
            src="../assets/south-texas-hill-country.png"
            alt="South Texas Hill Country property map">

          <button
            class="create-stand-star ${saved ? "is-saved" : ""}"
            type="button"
            data-create-stand-star
            aria-label="${
              saved
                ? "Open saved stand details"
                : "Place stand at marked location"
            }"
            title="${
              saved
                ? "Review saved stand"
                : "Tap X to place stand and add details"
            }">X</button>

          ${
            saved
              ? ""
              : `<div class="create-stand-map-callout">Tap X to place stand and add details.</div>`
          }

          <article
            class="saved-stand-popover"
            data-saved-stand-popover
            hidden>
          </article>
        </div>
      </section>
    `);

    const star =
      modalContent.querySelector(
        "[data-create-stand-star]"
      );

    const popover =
      modalContent.querySelector(
        "[data-saved-stand-popover]"
      );

    if(!saved){
      star?.addEventListener(
        "click",
        openStandDetailsForm
      );

      return;
    }

    function showPopover(){
      popover.innerHTML = savedStandPopover(saved);
      popover.hidden = false;
    }

    function hidePopover(){
      popover.hidden = true;
    }

    star?.addEventListener("mouseenter",showPopover);
    star?.addEventListener("focus",showPopover);
    star?.addEventListener("click",function(){
      popover.hidden
        ? showPopover()
        : hidePopover();
    });

    popover?.addEventListener(
      "mouseenter",
      showPopover
    );

    modalContent
      .querySelector(".create-stand-map-frame")
      ?.addEventListener("mouseleave",hidePopover);
  }

  function openStandDetailsForm(){
    showModal(`
      <section class="create-stand-form">
        <p class="eyebrow">New Stand</p>
        <h2>Add Stand Details</h2>

        <p class="create-stand-instruction">
          Complete the guided details and save the stand.
        </p>

        <form data-create-stand-form>
          <div class="create-stand-form-grid">
            <div class="create-stand-field full">
              <label for="createdStandName">
                Stand name
              </label>

              <input
                id="createdStandName"
                name="name"
                type="text"
                value="Craig's Hill Country Stand"
                required>
            </div>

            <div class="create-stand-field">
              <label for="createdStandType">
                Type
              </label>

              <select
                id="createdStandType"
                name="type">
                <option selected>
                  Elevated Box Blind
                </option>
                <option>Hanging Tree Stand</option>
                <option>Ground Blind</option>
                <option>Ladder Stand</option>
              </select>
            </div>

            <div class="create-stand-field">
              <label for="createdStandWind">
                Best wind
              </label>

              <select
                id="createdStandWind"
                name="wind">
                <option>N</option>
                <option>NE</option>
                <option>E</option>
                <option>SE</option>
                <option>S</option>
                <option selected>SW</option>
                <option>W</option>
                <option>NW</option>
                <option>None</option>
              </select>
            </div>

            <div class="create-stand-field">
              <label for="createdStandTime">
                Best time of day
              </label>

              <select
                id="createdStandTime"
                name="time">
                <option>Any</option>
                <option selected>Morning</option>
                <option>Evening</option>
              </select>
            </div>

            <div class="create-stand-field">
              <label for="createdStandAccess">
                Access rating
              </label>

              <select
                id="createdStandAccess"
                name="access">
                <option>Excellent</option>
                <option selected>Good</option>
                <option>Moderate</option>
                <option>Difficult</option>
              </select>
            </div>

            <div class="create-stand-field">
              <label for="createdStandPressure">
                Pressure
              </label>

              <select
                id="createdStandPressure"
                name="pressure">
                <option selected>Fresh</option>
                <option>Moderate</option>
                <option>High</option>
              </select>
            </div>

            <div class="create-stand-field">
              <label for="createdStandSeason">
                Season
              </label>

              <select
                id="createdStandSeason"
                name="season">
                <option selected>Rifle 2026</option>
                <option>Archery 2026</option>
                <option>Any</option>
              </select>
            </div>

            <div class="create-stand-field full">
              <label for="createdStandNotes">
                Notes
              </label>

              <textarea
                id="createdStandNotes"
                name="notes">Approach from west stand trail. Short walk through woods.</textarea>
            </div>

            <div class="create-stand-field full">
              <div class="create-stand-location">
                <strong>Stand Waypoint</strong>
                <span>
                  ${standLocation.coordinates}
                </span>
              </div>
            </div>
          </div>

          <div class="create-stand-actions">
            <button
              class="action"
              type="button"
              data-create-stand-cancel>
              Cancel
            </button>

            <button
              class="action primary"
              type="submit">
              Save Stand
            </button>
          </div>
        </form>
      </section>
    `);

    modalContent
      .querySelector("[data-create-stand-cancel]")
      ?.addEventListener(
        "click",
        openCreateStandMap
      );

    modalContent
      .querySelector("[data-create-stand-form]")
      ?.addEventListener("submit",function(event){
        event.preventDefault();

        const formData =
          new FormData(event.currentTarget);

        const savedStand = {
          name:String(formData.get("name") || "").trim(),
          type:String(formData.get("type") || ""),
          wind:String(formData.get("wind") || ""),
          time:String(formData.get("time") || ""),
          access:String(formData.get("access") || ""),
          pressure:String(formData.get("pressure") || ""),
          season:String(formData.get("season") || ""),
          notes:String(formData.get("notes") || "").trim(),
          coordinates:standLocation.coordinates,
          createdBy:"Craig Boddington",
          createdAt:new Date().toISOString()
        };

        localStorage.setItem(
          storageKey,
          JSON.stringify(savedStand)
        );

        openCreateStandMap();
      });
  }

  function savedStandPopover(saved){
    return `
      <p class="eyebrow">Saved Deer Stand</p>
      <h3>${saved.name}</h3>

      <p>
        ${saved.createdBy}
      </p>

      <p>
        ${saved.notes}
      </p>

      <div class="saved-stand-tags">
        <span>${saved.type}</span>
        <span>Wind ${saved.wind}</span>
        <span>${saved.time}</span>
        <span>Access ${saved.access}</span>
        <span>Pressure ${saved.pressure}</span>
        <span>${saved.season}</span>
      </div>

      <p class="saved-stand-waypoint">
        ${saved.coordinates}
      </p>
    `;
  }

  /*
   * Capture the Create Stand Map click before older placeholder
   * handlers can respond.
   */
  document.addEventListener("click",function(event){
    const createButton = event.target.closest(
      '.hs-create-stand-map,' +
      '[data-action="create-stand-map"]'
    );

    if(!createButton) return;

    event.preventDefault();
    event.stopPropagation();
    event.stopImmediatePropagation();

    room.classList.remove("maps-guide-create");
    room.classList.add("maps-guide-complete");

    openCreateStandMap();
  },true);
})();
</script>
<script id="final-create-stand-field-guidance">
(function(){
  "use strict";

  const modalLayer =
    document.querySelector("[data-modal-layer]");

  const modalContent =
    document.querySelector("[data-modal-content]");

  if(!modalLayer || !modalContent) return;

  const progressKey =
    "campBoddington.maps.standBuilderProgress";

  const reviewKey =
    "campBoddington.maps.savedStandReviewed";

  function clearFieldGuidance(){
    document
      .querySelectorAll(
        ".stand-field-guide-active," +
        ".stand-save-guide-active," +
        ".saved-x-review-guide"
      )
      .forEach(element=>{
        element.classList.remove(
          "stand-field-guide-active",
          "stand-save-guide-active",
          "saved-x-review-guide"
        );
      });
  }

  function fieldContainer(field){
    return (
      field.closest(
        ".compact-field," +
        ".create-stand-field," +
        ".field," +
        ".form-row"
      ) ||
      field.parentElement
    );
  }

  function guideMessage(root,text){
    let message =
      root.querySelector(
        "[data-stand-builder-guide-message]"
      );

    if(!message){
      message = document.createElement("div");

      message.className =
        "stand-builder-guide-message";

      message.setAttribute(
        "data-stand-builder-guide-message",
        "true"
      );

      const existingInstruction =
        Array.from(root.querySelectorAll("p"))
          .find(element=>
            /complete the guided details|make a few choices/i
              .test(element.textContent || "")
          );

      if(existingInstruction){
        existingInstruction.replaceWith(message);
      }
      else{
        const heading = root.querySelector("h2");

        heading?.insertAdjacentElement(
          "afterend",
          message
        );
      }
    }

    message.textContent = text;
  }

  function findFieldByLabel(root,pattern){
    const labels =
      Array.from(root.querySelectorAll("label"));

    const label =
      labels.find(element=>
        pattern.test(
          (element.textContent || "").trim()
        )
      );

    if(!label) return null;

    if(label.htmlFor){
      return root.querySelector(
        "#" + CSS.escape(label.htmlFor)
      );
    }

    return label.querySelector(
      "select,input,textarea"
    );
  }

  function initializeStandBuilder(root){
    if(root.dataset.finalFieldGuideReady === "true"){
      return;
    }

    root.dataset.finalFieldGuideReady = "true";

    const fields = [
      {
        name:"Type",
        field:
          findFieldByLabel(root,/^type$|stand type/i)
      },
      {
        name:"Best Wind",
        field:
          findFieldByLabel(root,/best wind/i)
      },
      {
        name:"Best Time of Day",
        field:
          findFieldByLabel(root,/best time/i)
      },
      {
        name:"Access Rating",
        field:
          findFieldByLabel(root,/access rating|^access$/i)
      },
      {
        name:"Pressure",
        field:
          findFieldByLabel(root,/pressure/i)
      },
      {
        name:"Season",
        field:
          findFieldByLabel(root,/season/i)
      },
      {
        name:"Notes",
        field:
          findFieldByLabel(root,/notes/i)
      }
    ].filter(item=>item.field);

    const saveButton =
      Array.from(root.querySelectorAll("button"))
        .find(button=>
          /save stand/i.test(
            button.textContent || ""
          )
        );

    if(!fields.length || !saveButton) return;

    let step = Number(
      sessionStorage.getItem(progressKey) || "0"
    );

    if(
      !Number.isFinite(step) ||
      step < 0 ||
      step > fields.length
    ){
      step = 0;
    }

    function showStep(){
      clearFieldGuidance();

      if(step >= fields.length){
        saveButton.classList.add(
          "stand-save-guide-active"
        );

        guideMessage(
          root,
          "All guided choices are complete. Tap Save Stand."
        );

        saveButton.focus({
          preventScroll:true
        });

        return;
      }

      const current = fields[step];
      const container =
        fieldContainer(current.field);

      container?.classList.add(
        "stand-field-guide-active"
      );

      guideMessage(
        root,
        `Choose ${current.name}, then continue to the next detail.`
      );

      current.field.focus({
        preventScroll:true
      });

      current.field.scrollIntoView({
        behavior:"smooth",
        block:"center"
      });
    }

    fields.forEach((item,index)=>{
      function advance(){
        if(index !== step) return;

        step += 1;

        sessionStorage.setItem(
          progressKey,
          String(step)
        );

        window.setTimeout(showStep,120);
      }

      if(item.field.tagName === "SELECT"){
        item.field.addEventListener(
          "change",
          advance
        );
      }
      else{
        item.field.addEventListener(
          "change",
          advance
        );

        item.field.addEventListener(
          "blur",
          advance
        );
      }
    });

    saveButton.addEventListener(
      "click",
      function(){
        if(step < fields.length){
          return;
        }

        sessionStorage.removeItem(progressKey);
        sessionStorage.setItem(reviewKey,"false");
      },
      true
    );

    showStep();
  }

  function addFinalInstruction(root){
    let instruction =
      root.querySelector(
        "[data-final-x-return-instruction]"
      );

    if(!instruction){
      instruction =
        document.createElement("div");

      instruction.className =
        "final-x-return-instruction";

      instruction.setAttribute(
        "data-final-x-return-instruction",
        "true"
      );

      instruction.hidden = true;

      const header =
        root.querySelector(
          ".create-stand-map-header"
        );

      if(header){
        header.insertAdjacentElement(
          "afterend",
          instruction
        );
      }
      else{
        root.prepend(instruction);
      }
    }

    return instruction;
  }

  function initializeSavedMap(root){
    const marker =
      root.querySelector(
        ".create-stand-x.is-saved," +
        ".create-stand-star.is-saved," +
        "[data-create-stand-x].is-saved," +
        "[data-create-stand-star].is-saved"
      );

    if(!marker) return;

    const instruction =
      addFinalInstruction(root);

    const reviewed =
      sessionStorage.getItem(reviewKey) === "true";

    clearFieldGuidance();

    if(!reviewed){
      marker.classList.add(
        "saved-x-review-guide"
      );

      instruction.hidden = true;

      const normalInstruction =
        Array.from(root.querySelectorAll("p"))
          .find(element=>
            /hover over x|review your stand summary/i
              .test(element.textContent || "")
          );

      if(normalInstruction){
        normalInstruction.textContent =
          "Hover over X to review your stand summary.";
      }

      function markReviewed(){
        sessionStorage.setItem(
          reviewKey,
          "true"
        );

        marker.classList.remove(
          "saved-x-review-guide"
        );

        instruction.textContent =
          "Tap X to return to Maps Room.";

        instruction.hidden = false;
      }

      if(marker.dataset.finalReviewBound !== "true"){
        marker.dataset.finalReviewBound = "true";

        marker.addEventListener(
          "mouseenter",
          markReviewed,
          {once:true}
        );

        marker.addEventListener(
          "focus",
          markReviewed,
          {once:true}
        );
      }

      return;
    }

    instruction.textContent =
      "Tap X to return to Maps Room.";

    instruction.hidden = false;
  }

  function inspectModal(){
    const text =
      modalContent.textContent || "";

    if(/Add Stand Details/i.test(text)){
      initializeStandBuilder(modalContent);
      return;
    }

    if(
      /South Texas Hill Country/i.test(text) &&
      /Hover over X|saved stand|stand summary/i.test(text)
    ){
      window.setTimeout(
        ()=>initializeSavedMap(modalContent),
        50
      );
    }
  }

  const observer =
    new MutationObserver(function(){
      window.setTimeout(inspectModal,0);
    });

  observer.observe(modalContent,{
    childList:true,
    subtree:true
  });

  observer.observe(modalLayer,{
    attributes:true,
    attributeFilter:["hidden"]
  });

  document.addEventListener(
    "click",
    function(){
      window.setTimeout(inspectModal,50);
    },
    true
  );

  inspectModal();
})();
</script>
</body>
</html>
