<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Camp Boddington Archives Room</title>
  <link rel="stylesheet" href="../rooms/shared/room-shell.css">
  <link rel="stylesheet" href="./archive-room.css">
  <link rel="stylesheet" href="./v7-final-overrides.css?v=20260802-back-hotspot-final">
</head>
<body>
  <main class="room-shell archive-room" aria-label="Camp Boddington Archives Room">
    <section class="room-stage">
      <img class="room-art" src="./archive-room.png" alt="Camp Boddington Archives Room with legacy books, timeline display, historic photographs, records cabinet, artifacts, publications, archive search desk, and guided preservation actions.">

      <!-- Physical archive objects: redundant affordances for View & Discover. -->
      <button class="room-hotspot archive-object hs-object-legacy" type="button" data-archive-action="legacySeries" aria-label="Open Legacy Series" data-tooltip="Open Legacy Series"></button>
      <button class="room-hotspot archive-object hs-object-artifacts" type="button" data-archive-action="historicArtifacts" aria-label="Open Historic Artifacts" data-tooltip="Open Historic Artifacts"></button>

      <!-- DeerCamp Dedication: central reader and archive card 2. -->
      <button
        class="room-hotspot hs-dedication-screen"
        type="button"
        data-archive-action="dadDedication"
        aria-label="Open DeerCamp Dedication to My Father"
        data-tooltip="Open Dedication">
      </button>

      <button
        class="room-hotspot hs-dedication-card"
        type="button"
        data-archive-action="dadDedication"
        aria-label="Open archive card: DeerCamp Dedication to My Father"
        data-tooltip="Open Dedication">
      </button>

      <!-- Archives carousel: completed experiences. -->
      <button
        class="room-hotspot hs-carousel-legacy"
        type="button"
        data-status="available"
        data-archive-action="legacySeries"
        aria-label="Open Legacy Series Dad"
        data-tooltip="Open Legacy Series">
      </button>

      <button
        class="room-hotspot hs-carousel-artifacts"
        type="button"
        data-status="available"
        data-archive-action="historicArtifacts"
        aria-label="Open Eric's Historic Artifacts"
        data-tooltip="Open Historic Artifacts">
      </button>

      <!-- Guided View & Discover pills. -->
      <button class="room-hotspot hs-view-legacy" type="button" data-object="pill" data-status="available" data-archive-action="legacySeries" aria-label="Legacy Series" data-tooltip="Open Legacy Series"></button>
      <button class="room-hotspot hs-view-artifacts" type="button" data-object="pill" data-status="available" data-archive-action="historicArtifacts" aria-label="Historic Artifacts" data-tooltip="Open Historic Artifacts"></button>

      <!-- Guided Create & Preserve pills. -->
      <button class="room-hotspot hs-create-photo" type="button" data-object="pill" data-status="available" data-archive-action="addHistoricPhoto" aria-label="Add Historic Photo" data-tooltip="Record Artifact Memory"></button>
      <button class="room-hotspot hs-upload-artifact" type="button" data-object="pill" data-status="available" data-archive-action="uploadArtifact" aria-label="Upload Artifact" data-tooltip="Share Camp Memory"></button>

      <!-- Shared room navigation. -->
      <a
        class="archives-website-link"
        href="https://ourdeercamp.com/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Visit ourdeercamp.com"
        title="Visit ourdeercamp.com">
      </a>
      <button class="room-hotspot hs-back" type="button" data-room-nav="back" aria-label="Back to Camp" data-tooltip="Back to Camp Table"></button>

    </section>
  </main>

  <script src="../rooms/shared/content-viewer.js"></script>
  <script src="../rooms/shared/room-toast.js"></script>
  <script src="../rooms/shared/room-navigation.js"></script>
  <script src="../rooms/shared/room-hover-engine.js"></script>
  <script src="./archive-room-config.js"></script>
  <script src="./archive-room.js?v=20260802-auto-tabletop-return"></script>

  <script id="archives-direct-tabletop-return">
  document.addEventListener("DOMContentLoaded", () => {
    document
      .querySelectorAll('[data-room-nav="back"]')
      .forEach(button => {
        button.addEventListener(
          "click",
          event => {
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();

            localStorage.setItem(
              "campBoddington.archiveVisited",
              "true"
            );

            sessionStorage.setItem(
              "campBoddington.returnToTabletop",
              "true"
            );

            window.location.assign(
              "../?view=tabletop"
            );
          },
          true
        );
      });
  });
</script>
  <script id="archives-inline-guidance">
  (function () {
    "use strict";

    const LEGACY = "legacySeries";
    const ARTIFACTS = "historicArtifacts";

    const viewed = {
      legacySeries: false,
      historicArtifacts: false
    };

    let chosenExperience = null;
    let experienceWasOpen = false;
    let returnHandled = false;

    function legacyShelf() {
      return document.querySelector(".hs-object-legacy");
    }

    function artifactsShelf() {
      return document.querySelector(".hs-object-artifacts");
    }

    function createArtifactButton() {
      return document.querySelector(".hs-create-photo");
    }

    function clearAllGuidance() {
      document.querySelectorAll(
        ".demo-shelf-glow, .guided-pulse, .demo-create-glow"
      ).forEach(function (element) {
        element.classList.remove(
          "demo-shelf-glow",
          "guided-pulse",
          "demo-create-glow"
        );
      });
    }

    function applyShelfGlow(element) {
      if (!element) return;

      element.classList.remove("demo-shelf-glow");
      void element.offsetWidth;
      element.classList.add("demo-shelf-glow");
    }

    function applyCreateGlow(element) {
      if (!element) return;

      element.classList.remove("guided-pulse", "demo-create-glow");
      void element.offsetWidth;
      element.classList.add("demo-create-glow");

      /*
       * Older room logic may briefly remove guidance classes.
       * Reassert the Create state until Craig selects this action.
       */
      window.clearInterval(window.__archivesCreateGlowGuard);

      window.__archivesCreateGlowGuard = window.setInterval(function () {
        if (element.dataset.createGuidanceComplete === "true") {
          window.clearInterval(window.__archivesCreateGlowGuard);
          return;
        }

        element.classList.remove("guided-pulse");
        element.classList.add("demo-create-glow");
      }, 300);
    }

    function bothViewExperiencesComplete() {
      return viewed[LEGACY] && viewed[ARTIFACTS];
    }

    function showEntryChoices() {
      chosenExperience = null;
      experienceWasOpen = false;
      returnHandled = false;

      clearAllGuidance();

      const legacy = legacyShelf();
      const artifacts = artifactsShelf();

      if (legacy) {
        legacy.dataset.tooltip =
          "Open Legacy Series OR Open Historic Artifacts";
        applyShelfGlow(legacy);
      }

      if (artifacts) {
        artifacts.dataset.tooltip =
          "Open Historic Artifacts OR Open Legacy Series";
        applyShelfGlow(artifacts);
      }
    }

    function showNextStep() {
      clearAllGuidance();

      if (bothViewExperiencesComplete()) {
        const createButton = createArtifactButton();

        if (createButton) {
          createButton.dataset.tooltip = "Record Artifact Memory";
          applyCreateGlow(createButton);
        }

        return;
      }

      if (!viewed[LEGACY]) {
        const legacy = legacyShelf();

        if (legacy) {
          legacy.dataset.tooltip = "Open Legacy Series";
          applyShelfGlow(legacy);
        }

        return;
      }

      if (!viewed[ARTIFACTS]) {
        const artifacts = artifactsShelf();

        if (artifacts) {
          artifacts.dataset.tooltip = "Open Historic Artifacts";
          applyShelfGlow(artifacts);
        }
      }
    }

    function experienceIsVisible() {
      return Boolean(
        document.querySelector(
          '.legacy-overlay, .room-modal, [role="dialog"][aria-modal="true"]'
        )
      );
    }

    document.addEventListener(
      "click",
      function (event) {
        const action = event.target.closest("[data-archive-action]");

        if (!action) return;

        const key = action.getAttribute("data-archive-action");

        if (key === "addHistoricPhoto") {
          const createButton = createArtifactButton();

          if (createButton) {
            createButton.dataset.createGuidanceComplete = "true";
            createButton.classList.remove(
              "guided-pulse",
              "demo-create-glow"
            );
          }

          window.clearInterval(window.__archivesCreateGlowGuard);
          return;
        }

        if (key !== LEGACY && key !== ARTIFACTS) return;

        chosenExperience = key;
        viewed[key] = true;
        experienceWasOpen = true;
        returnHandled = false;

        clearAllGuidance();
      },
      true
    );

    const observer = new MutationObserver(function () {
      if (!chosenExperience || !experienceWasOpen || returnHandled) return;

      window.setTimeout(function () {
        if (!experienceIsVisible()) {
          returnHandled = true;
          experienceWasOpen = false;
          showNextStep();
        }
      }, 150);
    });

    function start() {
      /*
       * Neutralize older archive-room.js guidance so Create does not
       * pulse before both View & Discover experiences are complete.
       */
      window.pulseAddPhoto = function () {};
      window.pulseUploadArtifact = function () {};

      observer.observe(document.body, {
        childList: true,
        subtree: true,
        attributes: true,
        attributeFilter: ["class", "hidden", "style"]
      });

      window.setTimeout(showEntryChoices, 250);
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", start, { once: true });
    } else {
      start();
    }

    window.ArchivesDemoGuidance = {
      showEntryChoices: showEntryChoices,
      showNextStep: showNextStep
    };
  })();
  </script>
  <script id="archives-share-memory-handoff">
  (function(){
    "use strict";

    function recordButton(){
      return document.querySelector(".hs-create-photo");
    }

    function shareButton(){
      return document.querySelector(".hs-upload-artifact");
    }

    function clearCreateGuidance(){
      document
        .querySelectorAll(".demo-create-glow, .demo-share-glow, .guided-pulse")
        .forEach(function(element){
          element.classList.remove(
            "demo-create-glow",
            "demo-share-glow",
            "guided-pulse"
          );
        });
    }

    function showShareGuidance(){
      clearCreateGuidance();

      const share = shareButton();

      if(!share) return;

      share.dataset.tooltip = "Share Camp Memory";
      share.classList.add("demo-share-glow");

      window.clearInterval(window.__archivesShareGlowGuard);

      window.__archivesShareGlowGuard = window.setInterval(function(){
        if(share.dataset.shareGuidanceComplete === "true"){
          window.clearInterval(window.__archivesShareGlowGuard);
          return;
        }

        share.classList.remove("guided-pulse");
        share.classList.add("demo-share-glow");
      },300);
    }

    document.addEventListener("click",function(event){
      const returnButton = event.target.closest(
        "[data-artifact-memory-return]"
      );

      if(returnButton){
        window.setTimeout(showShareGuidance,400);
        return;
      }

      const action = event.target.closest(
        '[data-archive-action="uploadArtifact"]'
      );

      if(action){
        action.dataset.shareGuidanceComplete = "true";
        action.classList.remove(
          "demo-share-glow",
          "guided-pulse"
        );

        window.clearInterval(
          window.__archivesShareGlowGuard
        );
      }
    },true);

    window.ArchivesShareGuidance = {
      show:showShareGuidance
    };
  })();
  </script>
</body>
</html>
